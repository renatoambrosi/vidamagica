<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#E8DCC0" />
  <title>Espaço da Manifestação · Vida Mágica</title>
  <!-- Fontes self-hostadas do app (Montserrat / Lora / Open Sans) — sem Google -->
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <link rel="stylesheet" href="/espaco.css?v=12" />
</head>
<body data-tema="vida_magica">

  <!-- ════════════════════════════════════════════════════════════
       ANIMAÇÃO DE ABERTURA — cérebro dourado (portada do Caderno).
       SEMPRE dourada, independente do tema. Aprovada — não mexer.
       Dispara toda vez que entra no Espaço. Lógica em espaco.js.
       ════════════════════════════════════════════════════════════ -->
  <div class="espaco-loading" id="espaco-loading" aria-hidden="true">
    <div class="espaco-loading-sparkles" id="espaco-loading-sparkles" aria-hidden="true"></div>
    <div class="espaco-loading-cerebro" aria-hidden="true">
      <img src="/assets/cerebro.png?v=1" alt="" class="espaco-cerebro-img" />
      <div class="espaco-cerebro-dots">
        <span class="cdot cdot-a" style="left:77.8%;top:31.1%"></span>
        <span class="cdot cdot-b" style="left:22.1%;top:45.7%"></span>
        <span class="cdot cdot-c" style="left:35.2%;top:27.3%"></span>
        <span class="cdot cdot-d" style="left:53.4%;top:40.0%"></span>
        <span class="cdot cdot-e" style="left:80.7%;top:47.6%"></span>
        <span class="cdot cdot-a" style="left:76.8%;top:51.4%"></span>
        <span class="cdot cdot-b" style="left:63.2%;top:34.9%"></span>
        <span class="cdot cdot-c" style="left:42.4%;top:36.2%"></span>
        <span class="cdot cdot-d" style="left:29.8%;top:39.4%"></span>
        <span class="cdot cdot-e" style="left:50.5%;top:53.3%"></span>
        <span class="cdot cdot-a" style="left:45.6%;top:21.2%"></span>
        <span class="cdot cdot-b" style="left:70.3%;top:20.3%"></span>
        <span class="cdot cdot-c" style="left:74.1%;top:26.6%"></span>
        <span class="cdot cdot-d" style="left:52.1%;top:28.9%"></span>
        <span class="cdot cdot-e" style="left:73.8%;top:33.6%"></span>
        <span class="cdot cdot-a" style="left:69.0%;top:49.9%"></span>
        <span class="cdot cdot-b" style="left:61.3%;top:55.5%"></span>
        <span class="cdot cdot-c" style="left:74.4%;top:58.7%"></span>
        <span class="cdot cdot-d" style="left:69.4%;top:61.6%"></span>
        <span class="cdot cdot-e" style="left:35.4%;top:16.3%"></span>
        <span class="cdot cdot-a" style="left:62.6%;top:24.2%"></span>
        <span class="cdot cdot-b" style="left:22.1%;top:26.6%"></span>
        <span class="cdot cdot-c" style="left:17.9%;top:38.0%"></span>
        <span class="cdot cdot-d" style="left:29.9%;top:48.5%"></span>
        <span class="cdot cdot-e" style="left:53.1%;top:58.8%"></span>
        <span class="cdot cdot-a" style="left:56.2%;top:62.7%"></span>
        <span class="cdot cdot-b" style="left:65.1%;top:18.0%"></span>
        <span class="cdot cdot-c" style="left:66.3%;top:31.4%"></span>
        <span class="cdot cdot-d" style="left:81.0%;top:38.3%"></span>
        <span class="cdot cdot-e" style="left:72.4%;top:43.1%"></span>
        <span class="cdot cdot-a" style="left:39.8%;top:47.6%"></span>
        <span class="cdot cdot-b" style="left:56.7%;top:49.2%"></span>
        <span class="cdot cdot-c" style="left:32.9%;top:53.3%"></span>
        <span class="cdot cdot-d" style="left:37.0%;top:55.7%"></span>
        <span class="cdot cdot-e" style="left:64.6%;top:62.4%"></span>
      </div>
    </div>
    <div class="espaco-loading-frase-area" id="espaco-loading-frase-area"></div>
    <button type="button" class="espaco-loading-pular" id="espaco-loading-pular" style="display:none">Pular</button>
  </div>

  <!-- Partículas douradas (entram depois do loading) -->
  <div class="espaco-particulas" id="espaco-particulas" aria-hidden="true"></div>

  <!-- Estrelas cadentes — visíveis só no tema Universo (controle no CSS) -->
  <div class="espaco-fx-universo" aria-hidden="true">
    <span class="cadente" style="--cd-top:8%;--cd-left:10%;--cd-delay:0s"></span>
    <span class="cadente" style="--cd-top:16%;--cd-left:58%;--cd-delay:2.5s"></span>
    <span class="cadente" style="--cd-top:28%;--cd-left:32%;--cd-delay:5s"></span>
    <span class="cadente" style="--cd-top:10%;--cd-left:78%;--cd-delay:7.5s"></span>
    <span class="cadente" style="--cd-top:22%;--cd-left:4%;--cd-delay:9s"></span>
  </div>

  <!-- ════════════════════════════════════════════════════════════
       APP SHELL
       ════════════════════════════════════════════════════════════ -->
  <div class="espaco-app">

    <!-- HEADER -->
    <header class="espaco-header">
      <h1 class="espaco-header-titulo">Espaço da Manifestação</h1>
      <div class="espaco-acoes">
        <!-- "tema" (discreto) + bolinha — abre o dropdown. -->
        <button type="button" class="espaco-tema-trigger" id="espaco-tema-bolinha" aria-label="Escolher tema">
          <span class="espaco-tema-rotulo">tema</span>
          <span class="espaco-tema-bolinha"></span>
        </button>
        <!-- Sementes -->
        <span class="espaco-sementes" id="espaco-sementes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C9 6 6 8 6 13a6 6 0 0 0 12 0c0-5-3-7-6-11z"/>
          </svg>
          <span id="espaco-sementes-num">0</span>
        </span>
      </div>

      <!-- DROPDOWN DE TEMAS -->
      <div class="espaco-tema-menu" id="espaco-tema-menu" role="menu" aria-label="Temas">
        <button type="button" class="espaco-tema-item" data-tema="vida_magica" role="menuitem">
          <span class="espaco-tema-amostra vida_magica"></span>
          <span class="espaco-tema-nome">Vida Mágica</span>
          <span class="espaco-tema-check" aria-label="Aplicar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
        </button>
        <button type="button" class="espaco-tema-item" data-tema="magico" role="menuitem">
          <span class="espaco-tema-amostra magico"></span>
          <span class="espaco-tema-nome">Mágico</span>
          <span class="espaco-tema-check" aria-label="Aplicar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
        </button>
        <button type="button" class="espaco-tema-item" data-tema="universo" role="menuitem">
          <span class="espaco-tema-amostra universo"></span>
          <span class="espaco-tema-nome">Universo</span>
          <span class="espaco-tema-check" aria-label="Aplicar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
        </button>
        <button type="button" class="espaco-tema-item" data-tema="medieval" role="menuitem">
          <span class="espaco-tema-amostra medieval"></span>
          <span class="espaco-tema-nome">Medieval</span>
          <span class="espaco-tema-check" aria-label="Aplicar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
        </button>
      </div>

    </header>

    <!-- CORPO -->
    <main class="espaco-corpo">

      <!-- VIEW: ENTRADA (Meditação Guiada — escolha do caminho) -->
      <section class="espaco-view ativa" id="view-entrada">
        <div class="espaco-saudacao">
          <p class="espaco-eyebrow">Meditação Guiada</p>
          <h2 class="espaco-titulo-grande" id="espaco-saudacao-titulo">O que você quer viver agora?</h2>
          <p class="espaco-sub-grande">Escolha por onde começar.</p>
        </div>

        <div class="espaco-caminhos">
          <button type="button" class="espaco-caminho" data-caminho="meditar">
            <span class="espaco-caminho-icone">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
            </span>
            <span class="espaco-caminho-texto">
              <span class="espaco-caminho-titulo">Quero meditar</span>
              <span class="espaco-caminho-sub">Uma meditação guiada pra acalmar e focar</span>
            </span>
            <span class="espaco-caminho-seta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </button>

          <button type="button" class="espaco-caminho" data-caminho="carta">
            <span class="espaco-caminho-icone">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            </span>
            <span class="espaco-caminho-texto">
              <span class="espaco-caminho-titulo">Carta do tempo</span>
              <span class="espaco-caminho-sub">Escreva pro seu eu do futuro</span>
            </span>
            <span class="espaco-caminho-seta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </button>

          <button type="button" class="espaco-caminho" data-caminho="manifestar">
            <span class="espaco-caminho-icone">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.6 6.3L21 9l-5 4.2L17.5 20 12 16.3 6.5 20 8 13.2 3 9l6.4-.7z"/></svg>
            </span>
            <span class="espaco-caminho-texto">
              <span class="espaco-caminho-titulo">Quero manifestar algo</span>
              <span class="espaco-caminho-sub">Crie o card do seu sonho</span>
            </span>
            <span class="espaco-caminho-seta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </button>
        </div>
      </section>

    </main>

    <!-- MENU EMBAIXO (bottom-nav) — Início · Ambiente (botão central) · Perfil -->
    <nav class="espaco-bottom">
      <button type="button" class="espaco-bottom-item ativo" id="nav-inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.5"/><path d="M7.5 12a4.5 4.5 0 0 1 9 0"/><path d="M4 12a8 8 0 0 1 16 0"/></svg>
        <span>Meditação Guiada</span>
      </button>

      <!-- BOTÃO CENTRAL — Ambiente (timer + música + afirmações). Painel vem depois. -->
      <button type="button" class="espaco-bottom-central" id="ferr-ambiente" aria-label="Ambiente — timer, música e afirmações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l2-7 4 14 2-7h7"/></svg>
      </button>

      <button type="button" class="espaco-bottom-item" id="espaco-avatar" aria-label="Perfil">
        <span class="espaco-bottom-avatar" id="espaco-bottom-avatar"><span id="espaco-avatar-inicial">·</span></span>
        <span>Perfil</span>
      </button>

      <!-- DROPUP DO AVATAR (sobe do menu de baixo) -->
      <div class="espaco-avatar-menu" id="espaco-avatar-menu" role="menu" aria-label="Menu do perfil">
        <button type="button" class="espaco-avatar-item" id="menu-cartas" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <span>Minhas cartas do tempo</span>
        </button>
        <button type="button" class="espaco-avatar-item" id="menu-manifestacoes" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.6 6.3L21 9l-5 4.2L17.5 20 12 16.3 6.5 20 8 13.2 3 9l6.4-.7z"/></svg>
          <span>Minhas manifestações</span>
        </button>
        <div class="espaco-avatar-sep"></div>
        <button type="button" class="espaco-avatar-item sair" id="menu-voltar" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Voltar pra Vida Mágica</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Toast -->
  <div id="espaco-toast" style="position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);background:rgba(20,15,8,0.92);color:#f3e8d0;padding:0.7rem 1.2rem;border-radius:999px;font-size:0.9rem;opacity:0;pointer-events:none;transition:opacity .3s ease, transform .3s ease;z-index:120;max-width:88vw;text-align:center"></div>

  <script src="/app/espaco.js?v=3"></script>
</body>
</html>
