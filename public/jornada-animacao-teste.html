<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Animação Jornada — Teste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!--
    ============================================================
    VIDA MÁGICA — jornada-animacao-teste.html
    Animação cinematográfica da jornada da aluna.
    Standalone pra teste visual. Mock da Jornada 2 (Vida Mágica)
    hardcoded em CONFIG_JORNADA. Quando aprovado, plugamos no
    /app puxando os dados de /api/app/contexto.
    Paleta + tipografia = tokens do app.css.
    Implementação CSS + Web Animations API (sem libs).
    ============================================================
  -->

  <style>
    /* ===== Tokens da Vida Mágica (cópia de app.css) ===== */
    :root {
      --ouro: #C8922A;
      --ouro-claro: #E8C97A;
      --ouro-brilho: #F4D998;
      --ouro-fundo: #A17523;
      --ouro-pelicula: rgba(200, 146, 42, 0.12);
      --texto: #3D2E1A;
      --texto-suave: #6B5436;
      --vidro: rgba(255, 250, 240, 0.75);
      --vidro-forte: rgba(255, 250, 240, 0.92);
      --vidro-borda: rgba(200, 146, 42, 0.22);
      --vidro-borda-hi: rgba(200, 146, 42, 0.5);
      --sombra-suave: 0 2px 12px rgba(161, 117, 35, 0.08);
      --sombra-media: 0 4px 24px rgba(161, 117, 35, 0.14);
      --sombra-forte: 0 12px 48px rgba(161, 117, 35, 0.22);
      --glow-ouro: 0 0 24px rgba(200, 146, 42, 0.35), 0 0 48px rgba(200, 146, 42, 0.18);
      --glow-ouro-forte: 0 0 36px rgba(200, 146, 42, 0.55), 0 0 96px rgba(244, 217, 152, 0.35);
      --font-display: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Lora', Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3e6c8;
      color: var(--texto);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== Stage ===== */
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 35%, #fff9eb 0%, #f5ead0 55%, #e6d2a2 100%);
    }

    /* ===== Partículas douradas ao fundo ===== */
    .particulas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .particula {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--ouro-brilho) 0%, transparent 70%);
      opacity: 0;
      will-change: transform, opacity;
      animation: flutuar linear infinite;
    }

    @keyframes flutuar {
      0%   { transform: translate(0, 102vh) scale(0.5); opacity: 0; }
      10%  { opacity: 0.55; }
      90%  { opacity: 0.55; }
      100% { transform: translate(40px, -8vh) scale(1.2); opacity: 0; }
    }

    /* ===== Camera (wrapper que se transforma pra simular zoom) ===== */
    .camera {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      will-change: transform, filter;
      z-index: 5;
    }

    /* ===== Hexágono ===== */
    .hexagono {
      position: absolute;
      inset: 0;
    }

    .bolha {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--size, 180px);
      height: var(--size, 180px);
      margin-left: calc(var(--size, 180px) / -2);
      margin-top: calc(var(--size, 180px) / -2);
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--vidro-borda-hi);
      box-shadow: var(--glow-ouro), var(--sombra-media);
      background: var(--vidro-forte);
      opacity: 0;
      will-change: transform, opacity, filter, border-radius;
    }

    .bolha img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ===== Texto central (durante hexágono) ===== */
    .titulo-central {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 8;
      opacity: 0;
      will-change: opacity, transform;
      max-width: 80%;
    }

    .titulo-eyebrow {
      font-family: var(--font-body);
      font-style: italic;
      color: var(--texto-suave);
      letter-spacing: 0.04em;
      font-size: clamp(14px, 1.8vw, 22px);
      margin-bottom: 8px;
    }

    .titulo-nome {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 0.01em;
      font-size: clamp(28px, 4.6vw, 60px);
      background: linear-gradient(135deg, var(--ouro-fundo) 0%, var(--ouro-brilho) 50%, var(--ouro-fundo) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 16px rgba(200, 146, 42, 0.3));
    }

    /* ===== Carrossel vertical (cards no scroll central) ===== */
    .carrossel {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .card-scroll {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--cardSize, 50vmin);
      height: var(--cardSize, 50vmin);
      max-width: 460px;
      max-height: 460px;
      margin-left: calc(var(--cardSize, 50vmin) / -2);
      margin-top: calc(var(--cardSize, 50vmin) / -2);
      border-radius: 28px;
      overflow: hidden;
      border: 2px solid var(--vidro-borda-hi);
      box-shadow: var(--glow-ouro-forte), var(--sombra-forte);
      background: var(--vidro-forte);
      opacity: 0;
      will-change: transform, opacity, filter;
    }

    .card-scroll img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ===== Bolha final (estado final) ===== */
    .bolha-final {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--finalSize, 42vmin);
      height: var(--finalSize, 42vmin);
      max-width: 380px;
      max-height: 380px;
      margin-left: calc(var(--finalSize, 42vmin) / -2);
      margin-top: calc(var(--finalSize, 42vmin) / -2);
      transform: translate(0, -6%) scale(0.6);
      border-radius: 50%;
      overflow: hidden;
      border: 2.5px solid var(--vidro-borda-hi);
      box-shadow: var(--glow-ouro-forte), var(--sombra-forte);
      background: var(--vidro-forte);
      opacity: 0;
      will-change: transform, opacity;
      z-index: 6;
    }

    .bolha-final img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ===== Label final (debaixo da bolha final) ===== */
    .label-final {
      position: absolute;
      left: 0; right: 0;
      bottom: 12%;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(16px);
      will-change: opacity, transform;
      z-index: 7;
      padding: 0 24px;
    }

    .label-final .eyebrow {
      font-family: var(--font-body);
      font-style: italic;
      color: var(--texto-suave);
      font-size: clamp(13px, 1.5vw, 18px);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .label-final .name {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--ouro-fundo);
      font-size: clamp(22px, 3.4vw, 42px);
      letter-spacing: 0.01em;
      text-shadow: 0 2px 16px rgba(161, 117, 35, 0.18);
    }

    /* ===== Botão replay ===== */
    .replay {
      position: absolute;
      top: 22px;
      right: 22px;
      background: var(--vidro-forte);
      border: 1px solid var(--vidro-borda-hi);
      color: var(--texto);
      padding: 10px 18px 10px 14px;
      border-radius: 999px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.18s ease;
      z-index: 20;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .replay.visivel { opacity: 1; }
    .replay:hover { transform: scale(1.04); }
    .replay:active { transform: scale(0.96); }

    .replay svg {
      width: 14px;
      height: 14px;
    }

    /* ===== Mobile vertical (9:16) ===== */
    @media (max-aspect-ratio: 1/1) {
      .titulo-nome { font-size: clamp(26px, 7vw, 44px); }
      .card-scroll { max-width: 76vw; max-height: 76vw; }
      .bolha-final { max-width: 60vw; max-height: 60vw; }
      .label-final { bottom: 10%; }
    }

    /* Acessibilidade: respeitar prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .particula { animation: none; opacity: 0.3; }
    }
  </style>
</head>

<body>
  <div class="stage" id="stage">
    <div class="particulas" id="particulas" aria-hidden="true"></div>

    <div class="camera" id="camera">
      <div class="hexagono" id="hexagono"></div>
      <div class="carrossel" id="carrossel"></div>

      <div class="titulo-central" id="titulo">
        <div class="titulo-eyebrow">Sua jornada</div>
        <div class="titulo-nome" id="titulo-nome">—</div>
      </div>

      <div class="bolha-final" id="bolha-final">
        <img id="bolha-final-img" alt="" />
      </div>
    </div>

    <div class="label-final" id="label-final">
      <div class="eyebrow">Sua trilha agora</div>
      <div class="name" id="label-nome">—</div>
    </div>

    <button class="replay" id="replay" type="button" aria-label="Rever animação">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 3-6.7"></path>
        <polyline points="3 4 3 10 9 10"></polyline>
      </svg>
      Rever
    </button>
  </div>

  <script>
    'use strict';

    // ============================================================
    // CONFIGURAÇÃO DA JORNADA (mock pro teste)
    // ============================================================
    // Trocar entre as 3 jornadas pra testar visualmente.
    // Quando integrar no /app, vem de /api/app/contexto.

    const JORNADAS_MOCK = {
      conhecer_e_despertar: {
        nome: 'Conhecer e Despertar',
        produtos: [
          { slug: 'teste_subconsciente',  imagem: '/assets/products/teste-subconsciente.webp' },
          { slug: 'vencendo_medo',        imagem: '/assets/products/ebook-vencendoomedo.webp' },
          { slug: 'vencendo_desordem',    imagem: '/assets/products/ebook-vencendoadesordem.webp' },
          { slug: 'ouro_reprogramacao',   imagem: '/assets/products/ouro-reprogramacao.webp' },
        ],
        destaque: { slug: 'ouro_reprogramacao', imagem: '/assets/products/ouro-reprogramacao.webp' },
      },
      vida_magica: {
        nome: 'Vida Mágica',
        produtos: [
          { slug: 'lda_biblica',         imagem: '/assets/products/lda-biblica.webp' },
          { slug: 'guia_pratico',        imagem: '/assets/products/guia-pratico.webp' },
          { slug: 'magica_fluir',        imagem: '/assets/products/magica-fluir.webp' },
          { slug: 'atal_maneira_livro',  imagem: '/assets/products/atal-maneira-livro.webp' },
        ],
        destaque: { slug: 'atal_maneira_livro', imagem: '/assets/products/atal-maneira-livro.webp' },
      },
      multiplicando_vida_magica: {
        nome: 'Multiplicando a Vida Mágica',
        produtos: [
          { slug: 'atal_maneira_curso',  imagem: '/assets/products/atal-maneira-curso.webp' },
        ],
        destaque: { slug: 'atal_maneira_curso', imagem: '/assets/products/atal-maneira-curso.webp' },
      },
    };

    // Escolher qual jornada testar — pode trocar via ?j=<slug> na URL
    const params = new URLSearchParams(location.search);
    const jornadaSlug = params.get('j') || 'vida_magica';
    const JORNADA = JORNADAS_MOCK[jornadaSlug] || JORNADAS_MOCK.vida_magica;

    // ============================================================
    // CONSTANTES DE LAYOUT E TIMING
    // ============================================================
    const HEX_N = 6;                  // 6 bolhas no hexágono
    const SCROLL_N = JORNADA.produtos.length; // cards únicos no scroll central

    // Timing (ms) — total ~10s
    const T = {
      bolhasIn:       { start:  200, dur: 1100, stagger: 130 }, // entrada hexágono
      tituloIn:       { start: 1500, dur:  700 },
      respirar:       { start: 2200, dur: 1200 }, // pausa pra ver
      tituloOut:      { start: 3400, dur:  450 },
      hexOut:         { start: 3400, dur:  700, stagger: 80 },  // bolhas somem
      // Scroll central: cada card passa pelo centro com blur de entrada/saída
      cardEnter:      1100,   // duração de cada card no scroll (subir até o centro)
      cardHold:       250,    // tempo segurando no centro
      cardExit:       900,    // duração de saída (de cima)
      cardOverlap:    520,    // sobreposição entre saída do anterior e entrada do próximo
      scrollStart:    3900,
      // Convergência final
      finalIn:        700,
      labelIn:        650,
      replayIn:       500,
    };

    // ============================================================
    // SETUP DOS ELEMENTOS
    // ============================================================
    function setupTextos() {
      document.getElementById('titulo-nome').textContent = JORNADA.nome;
      document.getElementById('label-nome').textContent = JORNADA.nome;
      const bf = document.getElementById('bolha-final-img');
      bf.src = JORNADA.destaque.imagem;
      bf.alt = JORNADA.destaque.slug;
    }

    function criarParticulas() {
      const container = document.getElementById('particulas');
      container.innerHTML = '';
      const N = 28;
      for (let i = 0; i < N; i++) {
        const p = document.createElement('div');
        p.className = 'particula';
        p.style.left = `${Math.random() * 100}%`;
        const dur = 12 + Math.random() * 14;
        p.style.animationDuration = `${dur}s`;
        p.style.animationDelay = `-${Math.random() * dur}s`;
        const scale = 0.5 + Math.random() * 1.3;
        p.style.transform = `scale(${scale})`;
        container.appendChild(p);
      }
    }

    function criarHexagono() {
      const hex = document.getElementById('hexagono');
      hex.innerHTML = '';

      const w = hex.clientWidth;
      const h = hex.clientHeight;
      const vertical = h > w * 1.05;

      // raio do hexágono e tamanho da bolha proporcionais
      const raio    = Math.min(w, h) * (vertical ? 0.30 : 0.27);
      const bolhaSz = Math.min(w, h) * (vertical ? 0.22 : 0.20);

      const data = [];
      for (let i = 0; i < HEX_N; i++) {
        const ang = (i * 60 - 90) * Math.PI / 180;
        const x = Math.cos(ang) * raio;
        const y = Math.sin(ang) * raio;

        const b = document.createElement('div');
        b.className = 'bolha';
        b.style.setProperty('--size', `${bolhaSz}px`);
        b.dataset.x = x.toFixed(1);
        b.dataset.y = y.toFixed(1);

        // cíclico — produtos.length pode ser < HEX_N (ex: Jornada 3 = 1 produto)
        const produto = JORNADA.produtos[i % JORNADA.produtos.length];
        const img = document.createElement('img');
        img.src = produto.imagem;
        img.alt = produto.slug;
        img.loading = 'eager';
        b.appendChild(img);

        hex.appendChild(b);
        data.push({ el: b, x, y });
      }
      return data;
    }

    function criarCarrossel() {
      const car = document.getElementById('carrossel');
      car.innerHTML = '';
      const w = car.clientWidth;
      const h = car.clientHeight;
      const vertical = h > w * 1.05;
      const cardSz = Math.min(w, h) * (vertical ? 0.78 : 0.55);

      const data = [];
      for (let i = 0; i < JORNADA.produtos.length; i++) {
        const card = document.createElement('div');
        card.className = 'card-scroll';
        card.style.setProperty('--cardSize', `${cardSz}px`);
        const produto = JORNADA.produtos[i];
        const img = document.createElement('img');
        img.src = produto.imagem;
        img.alt = produto.slug;
        img.loading = 'eager';
        card.appendChild(img);
        car.appendChild(card);
        data.push({ el: card, produto });
      }
      return data;
    }

    // ============================================================
    // ORQUESTRADOR DA ANIMAÇÃO
    // ============================================================
    let animacoesAtivas = [];

    function track(anim) {
      animacoesAtivas.push(anim);
      return anim;
    }

    function cancelarTudo() {
      animacoesAtivas.forEach(a => { try { a.cancel(); } catch (_) {} });
      animacoesAtivas = [];
    }

    function resetEstado() {
      // Reset visual sem recriar DOM (mais rápido pra replay)
      document.querySelectorAll('.bolha').forEach(b => {
        b.style.transform = 'translate(0,0) scale(0)';
        b.style.opacity = '0';
        b.style.filter = 'blur(0)';
        b.style.borderRadius = '50%';
      });
      document.querySelectorAll('.card-scroll').forEach(c => {
        c.style.transform = 'translate(0, 100vh) scale(0.85)';
        c.style.opacity = '0';
        c.style.filter = 'blur(8px)';
      });
      const t = document.getElementById('titulo');
      t.style.opacity = '0';
      t.style.transform = 'translate(-50%, -50%) scale(0.92)';
      const bf = document.getElementById('bolha-final');
      bf.style.opacity = '0';
      bf.style.transform = 'translate(0, -6%) scale(0.6)';
      const lf = document.getElementById('label-final');
      lf.style.opacity = '0';
      lf.style.transform = 'translateY(16px)';
      const rep = document.getElementById('replay');
      rep.classList.remove('visivel');
    }

    async function tocarAnimacao() {
      cancelarTudo();
      resetEstado();

      const bolhas  = Array.from(document.querySelectorAll('.bolha'));
      const cards   = Array.from(document.querySelectorAll('.card-scroll'));
      const titulo  = document.getElementById('titulo');
      const finalEl = document.getElementById('bolha-final');
      const label   = document.getElementById('label-final');
      const replay  = document.getElementById('replay');

      // ----- FASE 1: Hexágono entra (stagger) -----
      bolhas.forEach((b, i) => {
        const x = parseFloat(b.dataset.x);
        const y = parseFloat(b.dataset.y);
        const a = b.animate([
          { transform: 'translate(0,0) scale(0)', opacity: 0, offset: 0 },
          { transform: `translate(${x}px, ${y}px) scale(1.12)`, opacity: 1, offset: 0.7 },
          { transform: `translate(${x}px, ${y}px) scale(1)`, opacity: 1, offset: 1 },
        ], {
          duration: T.bolhasIn.dur,
          delay: T.bolhasIn.start + i * T.bolhasIn.stagger,
          easing: 'cubic-bezier(0.22, 1.2, 0.36, 1)',
          fill: 'forwards',
        });
        track(a);
      });

      // ----- FASE 2: Título central aparece -----
      const aTitIn = titulo.animate([
        { opacity: 0, transform: 'translate(-50%, -50%) scale(0.92)' },
        { opacity: 1, transform: 'translate(-50%, -50%) scale(1)' },
      ], {
        duration: T.tituloIn.dur,
        delay: T.tituloIn.start,
        easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
        fill: 'forwards',
      });
      track(aTitIn);

      // ----- FASE 3: Título sai + Hexágono sai (preparação pro carrossel) -----
      const aTitOut = titulo.animate([
        { opacity: 1, transform: 'translate(-50%, -50%) scale(1)' },
        { opacity: 0, transform: 'translate(-50%, -50%) scale(1.08)' },
      ], {
        duration: T.tituloOut.dur,
        delay: T.tituloOut.start,
        easing: 'cubic-bezier(0.7, 0, 0.84, 0)',
        fill: 'forwards',
      });
      track(aTitOut);

      bolhas.forEach((b, i) => {
        const x = parseFloat(b.dataset.x);
        const y = parseFloat(b.dataset.y);
        const a = b.animate([
          { transform: `translate(${x}px, ${y}px) scale(1)`, opacity: 1, filter: 'blur(0)' },
          { transform: `translate(${x * 1.6}px, ${y * 1.6}px) scale(1.6)`, opacity: 0, filter: 'blur(10px)' },
        ], {
          duration: T.hexOut.dur,
          delay: T.hexOut.start + i * T.hexOut.stagger,
          easing: 'cubic-bezier(0.7, 0, 0.84, 0)',
          fill: 'forwards',
        });
        track(a);
      });

      // ----- FASE 4: Carrossel vertical — cards passam pelo centro -----
      // Cada card: entra de baixo embaçado → para no centro nítido → sai por cima embaçado
      const cardCycle = T.cardEnter + T.cardHold + T.cardExit; // ciclo completo de 1 card
      // Para criar a sensação de fluxo contínuo, cards se sobrepõem:
      const stride = T.cardEnter + T.cardHold - T.cardOverlap; // tempo entre entrada de cards consecutivos

      cards.forEach((c, i) => {
        const tIni = T.scrollStart + i * stride;
        const a = c.animate([
          // Entrada (de baixo, blur, baixa opacidade)
          { transform: 'translate(0, 70vh) scale(0.92)', opacity: 0, filter: 'blur(10px)', offset: 0 },
          // Sobe pro foco
          { transform: 'translate(0, 0) scale(1.02)',     opacity: 1, filter: 'blur(0)',   offset: T.cardEnter / cardCycle },
          // Segura no foco
          { transform: 'translate(0, -2vh) scale(1.04)',  opacity: 1, filter: 'blur(0)',   offset: (T.cardEnter + T.cardHold) / cardCycle },
          // Saída (pra cima, blur)
          { transform: 'translate(0, -70vh) scale(0.96)', opacity: 0, filter: 'blur(10px)', offset: 1 },
        ], {
          duration: cardCycle,
          delay: tIni,
          easing: 'cubic-bezier(0.5, 0, 0.5, 1)',
          fill: 'forwards',
        });
        track(a);
      });

      // Quando o ÚLTIMO card chegar ao centro, ele NÃO sai — congela e vira a bolha-final
      // Cancelamos a animação dele um pouco antes do exit e iniciamos a final
      const ultimoCard = cards[cards.length - 1];
      const tUltimoCentro = T.scrollStart + (cards.length - 1) * stride + T.cardEnter + T.cardHold;
      // Substituímos a animação do último card por uma que segura no centro
      setTimeout(() => {
        if (!ultimoCard) return;
        // Cancela animação corrente do último
        ultimoCard.getAnimations().forEach(a => { try { a.cancel(); } catch (_) {} });
        ultimoCard.style.opacity = '1';
        ultimoCard.style.filter = 'blur(0)';
        ultimoCard.style.transform = 'translate(0, -2vh) scale(1.04)';

        // Encolhe pra dentro da bolha-final
        const aShrink = ultimoCard.animate([
          { transform: 'translate(0, -2vh) scale(1.04)', borderRadius: '28px', opacity: 1 },
          { transform: 'translate(0, -6%) scale(0.6)',    borderRadius: '50%', opacity: 0 },
        ], {
          duration: T.finalIn,
          easing: 'cubic-bezier(0.7, 0, 0.84, 0)',
          fill: 'forwards',
        });
        track(aShrink);

        // Bolha final entra
        const aFinal = finalEl.animate([
          { opacity: 0, transform: 'translate(0, -6%) scale(0.6)' },
          { opacity: 1, transform: 'translate(0, -6%) scale(1)' },
        ], {
          duration: T.finalIn + 200,
          easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
          fill: 'forwards',
        });
        track(aFinal);
      }, tUltimoCentro);

      // ----- FASE 5: Label final + Botão Rever -----
      const tLabel = tUltimoCentro + T.finalIn + 150;
      setTimeout(() => {
        const aLabel = label.animate([
          { opacity: 0, transform: 'translateY(16px)' },
          { opacity: 1, transform: 'translateY(0)' },
        ], {
          duration: T.labelIn,
          easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
          fill: 'forwards',
        });
        track(aLabel);
      }, tLabel);

      const tReplay = tLabel + T.labelIn + 150;
      setTimeout(() => { replay.classList.add('visivel'); }, tReplay);
    }

    // ============================================================
    // BOOT
    // ============================================================
    setupTextos();
    criarParticulas();
    criarHexagono();
    criarCarrossel();

    // espera curta pra imagens decoderem
    let imgsCarregadas = 0;
    const totalImgs = document.querySelectorAll('.bolha img, .card-scroll img, .bolha-final img').length;
    function tentarTocar() {
      imgsCarregadas++;
      if (imgsCarregadas >= totalImgs) {
        setTimeout(tocarAnimacao, 250);
      }
    }
    document.querySelectorAll('.bolha img, .card-scroll img, .bolha-final img').forEach(img => {
      if (img.complete) {
        tentarTocar();
      } else {
        img.addEventListener('load', tentarTocar, { once: true });
        img.addEventListener('error', tentarTocar, { once: true });
      }
    });
    // fallback de segurança
    setTimeout(() => {
      if (imgsCarregadas < totalImgs) {
        tocarAnimacao();
      }
    }, 2000);

    document.getElementById('replay').addEventListener('click', () => {
      tocarAnimacao();
    });

    // Recria layout em resize (debounced)
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        criarHexagono();
        criarCarrossel();
        tocarAnimacao();
      }, 350);
    });
  </script>
</body>
</html>
