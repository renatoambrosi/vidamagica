<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sua Jornada — Vida Mágica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!--
    ============================================================
    VIDA MÁGICA — jornada-animacao-teste.html (v2)
    Página de revelação da jornada da aluna.
    Toca uma vez (quando a jornada é criada).
    Estrutura:
      1. HERO com animação intro (hex → painéis descendo → row de bolinhas)
      2. Seção HTML estática com detalhes de cada passo (mesmo conteúdo
         dos painéis, mas em HTML real e navegável)
    Paleta + tipografia = tokens do app.css.
    Implementação CSS + Web Animations API.
    ============================================================
  -->

  <style>
    /* ===== Tokens Vida Mágica ===== */
    :root {
      --ouro: #C8922A;
      --ouro-claro: #E8C97A;
      --ouro-brilho: #F4D998;
      --ouro-fundo: #A17523;
      --ouro-pelicula: rgba(200, 146, 42, 0.12);
      --texto: #3D2E1A;
      --texto-suave: #6B5436;
      --texto-mute: rgba(61, 46, 26, 0.55);
      --vidro: rgba(255, 250, 240, 0.75);
      --vidro-forte: rgba(255, 250, 240, 0.92);
      --vidro-borda: rgba(200, 146, 42, 0.22);
      --vidro-borda-hi: rgba(200, 146, 42, 0.5);
      --sombra-suave: 0 2px 12px rgba(161, 117, 35, 0.08);
      --sombra-media: 0 4px 24px rgba(161, 117, 35, 0.14);
      --sombra-forte: 0 12px 48px rgba(161, 117, 35, 0.22);
      --glow-ouro: 0 0 24px rgba(200, 146, 42, 0.35), 0 0 48px rgba(200, 146, 42, 0.18);
      --glow-ouro-forte: 0 0 36px rgba(200, 146, 42, 0.55), 0 0 96px rgba(244, 217, 152, 0.35);
      --font-display: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Lora', Georgia, serif;
      --hero-grad: radial-gradient(ellipse at 50% 28%, #fff9eb 0%, #f5ead0 55%, #e6d2a2 100%);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #f3e6c8;
      color: var(--texto);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100%;
    }

    body {
      overflow-x: hidden;
    }

    /* ===========================================
       HERO — Animação intro
       =========================================== */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 640px;
      overflow: hidden;
      background: var(--hero-grad);
    }

    /* Partículas douradas */
    .particulas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .particula {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--ouro-brilho) 0%, transparent 70%);
      opacity: 0;
      will-change: transform, opacity;
      animation: flutuar linear infinite;
    }
    @keyframes flutuar {
      0%   { transform: translate(0, 102vh) scale(0.5); opacity: 0; }
      10%  { opacity: 0.55; }
      90%  { opacity: 0.55; }
      100% { transform: translate(40px, -8vh) scale(1.2); opacity: 0; }
    }

    /* Stage que segura tudo do hero */
    .hero-stage {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* ===== TÍTULO DO TOPO ===== */
    .titulo-topo {
      position: absolute;
      left: 50%;
      top: 6%;
      transform: translateX(-50%);
      text-align: center;
      width: 92%;
      max-width: 900px;
      opacity: 0;
      will-change: opacity, transform;
      z-index: 4;
      pointer-events: none;
    }

    .titulo-eyebrow {
      font-family: var(--font-body);
      font-style: italic;
      color: var(--texto-suave);
      letter-spacing: 0.04em;
      font-size: clamp(13px, 1.6vw, 19px);
      margin-bottom: 8px;
    }

    .titulo-nome {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 0.005em;
      line-height: 1.05;
      font-size: clamp(30px, 5.2vw, 64px);
      background: linear-gradient(135deg, var(--ouro-fundo) 0%, var(--ouro-brilho) 50%, var(--ouro-fundo) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 16px rgba(200, 146, 42, 0.3));
    }

    .titulo-sublinha {
      font-family: var(--font-body);
      font-style: italic;
      color: var(--texto-suave);
      font-size: clamp(13px, 1.4vw, 17px);
      margin-top: 10px;
      opacity: 0.85;
    }

    /* ===== HEXÁGONO ===== */
    /* Posicionado ABAIXO do título, sem sobrepor */
    .hexagono {
      position: absolute;
      left: 50%;
      top: 64%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 560px;
      aspect-ratio: 1 / 1;
      pointer-events: none;
      z-index: 3;
    }
    .bolha {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--size, 130px);
      height: var(--size, 130px);
      margin-left: calc(var(--size, 130px) / -2);
      margin-top: calc(var(--size, 130px) / -2);
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--vidro-borda-hi);
      box-shadow: var(--glow-ouro), var(--sombra-media);
      background: var(--vidro-forte);
      opacity: 0;
      will-change: transform, opacity, filter;
    }
    .bolha img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ===== PAINEL (cada passo descendo) ===== */
    .paineis {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
    }
    .painel {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) translateY(-120vh) scale(0.95);
      width: 92%;
      max-width: 900px;
      max-height: 88vh;
      opacity: 0;
      filter: blur(8px);
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      align-items: center;
      gap: clamp(20px, 4vw, 56px);
      padding: clamp(20px, 3vw, 36px);
      background: var(--vidro-forte);
      border: 1.5px solid var(--vidro-borda-hi);
      border-radius: 28px;
      box-shadow: var(--glow-ouro-forte), var(--sombra-forte);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      will-change: transform, opacity, filter;
    }

    .painel-imagem {
      position: relative;
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }
    .painel-imagem .capa {
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--sombra-forte);
      border: 2px solid var(--vidro-borda-hi);
    }
    .painel-imagem .capa img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* Quando tem 2 capas, ficam lado a lado menores */
    .painel-imagem.tem-2 .capa { max-width: 160px; }
    .painel-imagem.tem-2 .capa:nth-child(2) {
      transform: translateY(20px) rotate(2deg);
    }
    .painel-imagem.tem-2 .capa:first-child {
      transform: translateY(-20px) rotate(-2deg);
    }

    .painel-texto {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .painel-passo-tag {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 8px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(11px, 1.1vw, 13px);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--ouro-fundo);
      padding: 6px 14px;
      background: var(--ouro-pelicula);
      border: 1px solid var(--vidro-borda);
      border-radius: 999px;
    }
    .painel-passo-tag .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--ouro-fundo), var(--ouro-claro));
      color: #fff;
      font-size: 11px;
    }
    .painel-titulo {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(28px, 4.2vw, 48px);
      line-height: 1.05;
      letter-spacing: 0.005em;
      background: linear-gradient(135deg, var(--ouro-fundo) 0%, var(--ouro-brilho) 60%, var(--ouro-fundo) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .painel-produto-nome {
      font-family: var(--font-display);
      font-weight: 600;
      color: var(--texto);
      font-size: clamp(15px, 1.6vw, 19px);
      line-height: 1.3;
    }
    .painel-descricao {
      font-family: var(--font-body);
      color: var(--texto-suave);
      font-size: clamp(14px, 1.5vw, 18px);
      line-height: 1.55;
    }

    /* ===== ROW FINAL — bolinhas clicáveis ===== */
    .final {
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 3vh, 32px);
      padding: 0 24px;
      opacity: 0;
    }
    .final.visivel { pointer-events: auto; }

    .final-eyebrow {
      font-family: var(--font-body);
      font-style: italic;
      color: var(--texto-suave);
      font-size: clamp(13px, 1.5vw, 18px);
      letter-spacing: 0.04em;
    }
    .final-titulo {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(28px, 4.5vw, 56px);
      line-height: 1.05;
      background: linear-gradient(135deg, var(--ouro-fundo), var(--ouro-brilho) 50%, var(--ouro-fundo));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
      filter: drop-shadow(0 0 14px rgba(200, 146, 42, 0.25));
    }
    .final-subtitulo {
      font-family: var(--font-body);
      color: var(--texto-suave);
      font-size: clamp(14px, 1.6vw, 19px);
      text-align: center;
      max-width: 640px;
    }

    .row-bolinhas {
      display: flex;
      gap: clamp(8px, 1.4vw, 18px);
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      margin-top: 8px;
    }
    .bolinha-final {
      position: relative;
      width: clamp(64px, 9vw, 110px);
      height: clamp(64px, 9vw, 110px);
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--vidro-borda-hi);
      box-shadow: var(--glow-ouro), var(--sombra-media);
      background: var(--vidro-forte);
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
      opacity: 0;
      transform: scale(0.6) translateY(20px);
      will-change: transform, opacity;
      padding: 0;
      flex: 0 0 auto;
    }
    .bolinha-final img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .bolinha-final:hover {
      transform: scale(1.08) translateY(0);
      box-shadow: var(--glow-ouro-forte), var(--sombra-forte);
    }
    .bolinha-final:active { transform: scale(0.96) translateY(0); }

    .scroll-hint {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-family: var(--font-body);
      font-style: italic;
      color: var(--texto-mute);
      font-size: clamp(12px, 1.3vw, 15px);
      opacity: 0;
      pointer-events: none;
      animation: pulse-hint 2.2s ease-in-out infinite;
      animation-play-state: paused;
    }
    .scroll-hint.visivel {
      opacity: 1;
      animation-play-state: running;
    }
    .scroll-hint svg {
      width: 22px; height: 22px;
      stroke: var(--texto-mute);
    }
    @keyframes pulse-hint {
      0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.7; }
      50%      { transform: translateX(-50%) translateY(6px); opacity: 1; }
    }

    /* ===== Botão rever (canto) ===== */
    .btn-rever {
      position: fixed;
      top: 18px;
      right: 18px;
      background: var(--vidro-forte);
      border: 1px solid var(--vidro-borda-hi);
      color: var(--texto);
      padding: 9px 16px 9px 12px;
      border-radius: 999px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.03em;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.18s ease;
      z-index: 99;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-rever.visivel { opacity: 1; }
    .btn-rever:hover { transform: scale(1.04); }
    .btn-rever:active { transform: scale(0.96); }
    .btn-rever svg { width: 13px; height: 13px; }

    /* ===========================================
       SEÇÃO ESTÁTICA — Detalhes dos passos
       =========================================== */
    .secao-passos {
      background: linear-gradient(180deg, #faf2dd 0%, #f3e6c8 100%);
      padding: clamp(60px, 8vw, 120px) 24px clamp(80px, 10vw, 140px);
      position: relative;
    }
    .secao-passos::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(180deg, rgba(230, 210, 162, 0.4), transparent);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
    }

    .secao-eyebrow {
      font-family: var(--font-body);
      font-style: italic;
      color: var(--texto-suave);
      font-size: clamp(13px, 1.5vw, 18px);
      letter-spacing: 0.04em;
      text-align: center;
      margin-bottom: 12px;
    }
    .secao-titulo {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--texto);
      font-size: clamp(26px, 3.6vw, 42px);
      line-height: 1.15;
      letter-spacing: 0.005em;
      text-align: center;
      margin-bottom: clamp(40px, 5vw, 64px);
    }
    .secao-titulo .ouro {
      background: linear-gradient(135deg, var(--ouro-fundo), var(--ouro-brilho) 50%, var(--ouro-fundo));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .passo-card {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: clamp(24px, 3.5vw, 48px);
      align-items: center;
      padding: clamp(24px, 3.5vw, 48px);
      background: var(--vidro-forte);
      border: 1.5px solid var(--vidro-borda);
      border-radius: 28px;
      box-shadow: var(--sombra-media);
      margin-bottom: clamp(28px, 4vw, 56px);
      scroll-margin-top: 60px;
      transition: box-shadow 0.3s ease, transform 0.3s ease, border-color 0.3s ease;
    }
    .passo-card:hover,
    .passo-card.destacado {
      box-shadow: var(--glow-ouro), var(--sombra-forte);
      border-color: var(--vidro-borda-hi);
    }

    .passo-card-imagens {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }
    .passo-card-imagens .capa {
      width: 100%;
      max-width: 230px;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--sombra-media);
      border: 1.5px solid var(--vidro-borda);
    }
    .passo-card-imagens .capa img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .passo-card-imagens.tem-2 .capa { max-width: 145px; }
    .passo-card-imagens.tem-2 .capa:first-child { transform: rotate(-3deg); }
    .passo-card-imagens.tem-2 .capa:nth-child(2) { transform: rotate(3deg); }

    .passo-card-conteudo h3 {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--ouro-fundo);
      font-size: clamp(22px, 2.8vw, 32px);
      line-height: 1.1;
      margin-bottom: 6px;
      letter-spacing: 0.005em;
    }
    .passo-card-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ouro-fundo);
      padding: 5px 12px;
      background: var(--ouro-pelicula);
      border: 1px solid var(--vidro-borda);
      border-radius: 999px;
      margin-bottom: 14px;
    }
    .passo-card-tag .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--ouro-fundo), var(--ouro-claro));
      color: #fff;
      font-size: 10px;
    }
    .passo-card-produto-nome {
      font-family: var(--font-display);
      font-weight: 600;
      color: var(--texto);
      font-size: clamp(15px, 1.6vw, 19px);
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .passo-card-descricao {
      font-family: var(--font-body);
      color: var(--texto-suave);
      font-size: clamp(15px, 1.6vw, 18px);
      line-height: 1.6;
      margin-bottom: 22px;
    }
    .passo-card-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      background: linear-gradient(135deg, var(--ouro-fundo), var(--ouro));
      color: #fff;
      border: none;
      border-radius: 999px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.02em;
      cursor: pointer;
      text-decoration: none;
      box-shadow: var(--sombra-media);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .passo-card-cta:hover {
      transform: translateY(-2px);
      box-shadow: var(--glow-ouro), var(--sombra-forte);
    }
    .passo-card-cta:active { transform: translateY(0); }
    .passo-card-cta svg { width: 14px; height: 14px; }

    /* ===========================================
       Mobile (vertical)
       =========================================== */
    @media (max-aspect-ratio: 1/1), (max-width: 720px) {
      .titulo-topo { top: 6%; }
      .titulo-nome { font-size: clamp(28px, 8vw, 44px); }
      .hexagono { top: 56%; max-width: 90vw; }

      .painel {
        grid-template-columns: 1fr;
        max-width: 88vw;
        gap: 16px;
      }
      .painel-imagem .capa { max-width: 200px; }
      .painel-imagem.tem-2 .capa { max-width: 130px; }

      .passo-card {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .passo-card-imagens .capa { max-width: 200px; }
      .passo-card-tag {
        align-self: center;
        margin-left: auto;
        margin-right: auto;
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .particula { animation: none; opacity: 0.3; }
      .scroll-hint { animation: none; }
    }
  </style>
</head>

<body>
  <!-- HERO com animação intro -->
  <section class="hero" id="hero">
    <div class="particulas" id="particulas" aria-hidden="true"></div>

    <div class="hero-stage" id="stage">
      <!-- Título no TOPO (não sobrepõe o hex) -->
      <div class="titulo-topo" id="titulo-topo">
        <p class="titulo-eyebrow" id="titulo-eyebrow">A sua jornada começa</p>
        <h1 class="titulo-nome" id="titulo-nome">Vida Mágica</h1>
        <p class="titulo-sublinha" id="titulo-sublinha">Conheça os passos do seu caminho</p>
      </div>

      <!-- Hexágono de bolinhas (visual decorativo do início) -->
      <div class="hexagono" id="hexagono"></div>

      <!-- Painéis dos passos (descem do topo) -->
      <div class="paineis" id="paineis"></div>

      <!-- Estado final: row de bolinhas clicáveis -->
      <div class="final" id="final">
        <p class="final-eyebrow">Sua jornada</p>
        <h2 class="final-titulo" id="final-titulo">Vida Mágica</h2>
        <p class="final-subtitulo" id="final-subtitulo">Toque em qualquer item pra saber mais</p>
        <div class="row-bolinhas" id="row-bolinhas"></div>
      </div>

      <!-- Hint pra rolar -->
      <div class="scroll-hint" id="scroll-hint">
        <span>continue rolando</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="7 13 12 18 17 13"></polyline>
          <polyline points="7 7 12 12 17 7"></polyline>
        </svg>
      </div>
    </div>

    <button class="btn-rever" id="btn-rever" type="button" aria-label="Rever animação">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 3-6.7"></path>
        <polyline points="3 4 3 10 9 10"></polyline>
      </svg>
      Rever
    </button>
  </section>

  <!-- SEÇÃO ESTÁTICA — Detalhes dos passos -->
  <section class="secao-passos">
    <div class="container">
      <p class="secao-eyebrow">Sua trilha em detalhe</p>
      <h2 class="secao-titulo">Os passos da <span class="ouro" id="secao-titulo-jornada">Vida Mágica</span></h2>
      <div id="passos-lista"></div>
    </div>
  </section>

  <script>
    'use strict';

    // ============================================================
    // DADOS DAS JORNADAS (mock — depois vem de /api/app/contexto)
    // ============================================================

    const JORNADAS = {
      conhecer_e_despertar: {
        nome: 'Conhecer e Despertar',
        eyebrow: 'A sua jornada começa',
        sublinha: 'Conheça os passos do seu caminho',
        finalSubtitulo: 'Toque em qualquer item pra conhecer melhor',
        passos: [
          {
            ordem: 1,
            tag: 'Conhecer',
            titulo: 'O Teste do Subconsciente',
            descricao: 'O ponto de partida. O retrato fiel do que está hoje funcionando dentro de você — e do que precisa ser despertado.',
            produtos: [
              { slug: 'teste_subconsciente', nome: 'Teste do Subconsciente', imagem: '/assets/products/teste-subconsciente.webp', cta: 'Refazer o teste' },
            ],
          },
          {
            ordem: 2,
            tag: 'Despertar',
            titulo: 'Os livros que despertam',
            descricao: 'A Série Conhecer e Despertar trabalha as energias que mais aparecem no seu resultado. Um livro por trava.',
            produtos: [
              { slug: 'vencendo_medo',     nome: 'Vencendo o Medo',     imagem: '/assets/products/ebook-vencendoomedo.webp',     cta: 'Conhecer o livro' },
              { slug: 'vencendo_desordem', nome: 'Vencendo a Desordem', imagem: '/assets/products/ebook-vencendoadesordem.webp', cta: 'Conhecer o livro' },
            ],
          },
          {
            ordem: 3,
            tag: 'Reprogramação',
            titulo: 'O curso que reprograma',
            descricao: 'Depois de despertar, vem a reprogramação. O Ouro da Reprogramação Mental é o passo definitivo dessa primeira jornada.',
            produtos: [
              { slug: 'ouro_reprogramacao', nome: 'Curso Ouro da Reprogramação Mental', imagem: '/assets/products/ouro-reprogramacao.webp', cta: 'Conhecer o curso' },
            ],
          },
        ],
      },

      vida_magica: {
        nome: 'Vida Mágica',
        eyebrow: 'A sua jornada começa',
        sublinha: 'Conheça os passos do seu caminho',
        finalSubtitulo: 'Toque em qualquer item pra conhecer melhor',
        passos: [
          {
            ordem: 1,
            tag: 'Reprogramação',
            titulo: 'A base que recria sua mente',
            descricao: 'A Lei da Atração Bíblica é o curso que vai reescrever os padrões que você nem sabia que tinha. Tudo começa aqui.',
            produtos: [
              { slug: 'lda_biblica', nome: 'Curso Lei da Atração Bíblica', imagem: '/assets/products/lda-biblica.webp', cta: 'Conhecer o curso' },
            ],
          },
          {
            ordem: 2,
            tag: 'Prática diária',
            titulo: 'A reprogramação vira rotina',
            descricao: 'Dois guias pra você viver a reprogramação no dia a dia, na palma da mão. Práticas curtas, resultados que se acumulam.',
            produtos: [
              { slug: 'guia_pratico', nome: 'Guia Prático para Reprogramar a Mente', imagem: '/assets/products/guia-pratico.webp', cta: 'Ver o guia' },
              { slug: 'magica_fluir', nome: 'Guia de Bolso Mágica do Fluir',         imagem: '/assets/products/magica-fluir.webp', cta: 'Ver o guia de bolso' },
            ],
          },
          {
            ordem: 3,
            tag: 'Aprofundamento',
            titulo: 'O livro que abre o próximo nível',
            descricao: 'O Livro Digital A Tal Maneira é a ponte pra Multiplicando a Vida Mágica. A próxima jornada começa aqui.',
            produtos: [
              { slug: 'atal_maneira_livro', nome: 'Livro Digital A Tal Maneira', imagem: '/assets/products/atal-maneira-livro.webp', cta: 'Conhecer o livro' },
            ],
          },
        ],
      },

      multiplicando_vida_magica: {
        nome: 'Multiplicando a Vida Mágica',
        eyebrow: 'Você chegou na última jornada',
        sublinha: 'Um passo. Tudo o que falta pra multiplicar.',
        finalSubtitulo: 'Toque pra conhecer o curso definitivo',
        passos: [
          {
            ordem: 1,
            tag: 'Multiplicar',
            titulo: 'O curso definitivo da riqueza bíblica',
            descricao: 'A Tal Maneira é o curso que finaliza sua jornada — e abre a porta da multiplicação. Você só chegou até aqui porque já está pronta.',
            produtos: [
              { slug: 'atal_maneira_curso', nome: 'Curso A Tal Maneira', imagem: '/assets/products/atal-maneira-curso.webp', cta: 'Conhecer o curso' },
            ],
          },
        ],
      },
    };

    // Escolhe jornada via ?j= na URL
    const params = new URLSearchParams(location.search);
    const jornadaSlug = params.get('j') || 'vida_magica';
    const JORNADA = JORNADAS[jornadaSlug] || JORNADAS.vida_magica;

    // Lista achatada de produtos (pro hexágono ciclar e pra row final)
    const PRODUTOS_FLAT = JORNADA.passos.flatMap(p => p.produtos);

    // ============================================================
    // SETUP
    // ============================================================

    function preencherTextoFixo() {
      document.getElementById('titulo-eyebrow').textContent = JORNADA.eyebrow;
      document.getElementById('titulo-nome').textContent = JORNADA.nome;
      document.getElementById('titulo-sublinha').textContent = JORNADA.sublinha;
      document.getElementById('final-titulo').textContent = JORNADA.nome;
      document.getElementById('final-subtitulo').textContent = JORNADA.finalSubtitulo;
      document.getElementById('secao-titulo-jornada').textContent = JORNADA.nome;
    }

    function criarParticulas() {
      const c = document.getElementById('particulas');
      c.innerHTML = '';
      const N = 28;
      for (let i = 0; i < N; i++) {
        const p = document.createElement('div');
        p.className = 'particula';
        p.style.left = `${Math.random() * 100}%`;
        const dur = 12 + Math.random() * 14;
        p.style.animationDuration = `${dur}s`;
        p.style.animationDelay = `-${Math.random() * dur}s`;
        p.style.transform = `scale(${0.5 + Math.random() * 1.3})`;
        c.appendChild(p);
      }
    }

    const HEX_N = 6;

    function criarHexagono() {
      const hex = document.getElementById('hexagono');
      hex.innerHTML = '';
      const w = hex.clientWidth;
      const h = hex.clientHeight;
      const lado = Math.min(w, h);
      const raio = lado * 0.32;
      const bolhaSz = Math.min(130, lado * 0.22);

      const bolhas = [];
      for (let i = 0; i < HEX_N; i++) {
        // Começa do topo, sentido horário
        const ang = (i * 60 - 90) * Math.PI / 180;
        const x = Math.cos(ang) * raio;
        const y = Math.sin(ang) * raio;

        const b = document.createElement('div');
        b.className = 'bolha';
        b.style.setProperty('--size', `${bolhaSz}px`);
        b.dataset.x = x.toFixed(1);
        b.dataset.y = y.toFixed(1);

        const produto = PRODUTOS_FLAT[i % PRODUTOS_FLAT.length];
        const img = document.createElement('img');
        img.src = produto.imagem;
        img.alt = produto.nome;
        b.appendChild(img);

        hex.appendChild(b);
        bolhas.push(b);
      }
      return bolhas;
    }

    function criarPaineis() {
      const cont = document.getElementById('paineis');
      cont.innerHTML = '';
      JORNADA.passos.forEach((passo, idx) => {
        const painel = document.createElement('div');
        painel.className = 'painel';
        painel.dataset.idx = idx;

        const imgCont = document.createElement('div');
        imgCont.className = 'painel-imagem' + (passo.produtos.length > 1 ? ' tem-2' : '');
        passo.produtos.forEach(prod => {
          const capa = document.createElement('div');
          capa.className = 'capa';
          const img = document.createElement('img');
          img.src = prod.imagem;
          img.alt = prod.nome;
          capa.appendChild(img);
          imgCont.appendChild(capa);
        });

        const texto = document.createElement('div');
        texto.className = 'painel-texto';

        const tag = document.createElement('div');
        tag.className = 'painel-passo-tag';
        tag.innerHTML = `<span class="num">${passo.ordem}</span> ${passo.tag}`;
        texto.appendChild(tag);

        const titulo = document.createElement('div');
        titulo.className = 'painel-titulo';
        titulo.textContent = passo.titulo;
        texto.appendChild(titulo);

        const prodNome = document.createElement('div');
        prodNome.className = 'painel-produto-nome';
        prodNome.textContent = passo.produtos.map(p => p.nome).join('  +  ');
        texto.appendChild(prodNome);

        const desc = document.createElement('div');
        desc.className = 'painel-descricao';
        desc.textContent = passo.descricao;
        texto.appendChild(desc);

        painel.appendChild(imgCont);
        painel.appendChild(texto);
        cont.appendChild(painel);
      });
    }

    function criarRowBolinhas() {
      const row = document.getElementById('row-bolinhas');
      row.innerHTML = '';
      PRODUTOS_FLAT.forEach((prod, idx) => {
        const b = document.createElement('button');
        b.className = 'bolinha-final';
        b.dataset.slug = prod.slug;
        b.title = prod.nome;
        b.setAttribute('aria-label', prod.nome);
        const img = document.createElement('img');
        img.src = prod.imagem;
        img.alt = prod.nome;
        b.appendChild(img);

        b.addEventListener('click', () => {
          const alvo = document.querySelector(`[data-passo-slug="${prod.slug}"]`);
          if (alvo) {
            alvo.scrollIntoView({ behavior: 'smooth', block: 'center' });
            alvo.classList.add('destacado');
            setTimeout(() => alvo.classList.remove('destacado'), 2200);
          }
        });
        row.appendChild(b);
      });
    }

    function criarPassosDetalhes() {
      const cont = document.getElementById('passos-lista');
      cont.innerHTML = '';
      JORNADA.passos.forEach(passo => {
        const card = document.createElement('article');
        card.className = 'passo-card';
        // Marca cada produto com seu slug pra ancoragem
        const slugPrincipal = passo.produtos[0].slug;
        card.setAttribute('data-passo-slug', slugPrincipal);

        const imgs = document.createElement('div');
        imgs.className = 'passo-card-imagens' + (passo.produtos.length > 1 ? ' tem-2' : '');
        passo.produtos.forEach(prod => {
          const capa = document.createElement('div');
          capa.className = 'capa';
          // Ancoragem secundária pra cada produto também
          card.setAttribute('data-passo-slug-' + prod.slug, '1');
          const img = document.createElement('img');
          img.src = prod.imagem;
          img.alt = prod.nome;
          capa.appendChild(img);
          imgs.appendChild(capa);
        });

        const conteudo = document.createElement('div');
        conteudo.className = 'passo-card-conteudo';
        const tag = document.createElement('div');
        tag.className = 'passo-card-tag';
        tag.innerHTML = `<span class="num">${passo.ordem}</span> Passo ${passo.ordem} — ${passo.tag}`;
        conteudo.appendChild(tag);

        const h3 = document.createElement('h3');
        h3.textContent = passo.titulo;
        conteudo.appendChild(h3);

        const prodNomes = document.createElement('div');
        prodNomes.className = 'passo-card-produto-nome';
        prodNomes.textContent = passo.produtos.map(p => p.nome).join('  +  ');
        conteudo.appendChild(prodNomes);

        const desc = document.createElement('p');
        desc.className = 'passo-card-descricao';
        desc.textContent = passo.descricao;
        conteudo.appendChild(desc);

        // CTA do primeiro produto (poderia ter um por produto, mas mantemos 1 só pra começar)
        const cta = document.createElement('a');
        cta.className = 'passo-card-cta';
        cta.href = '#';
        cta.innerHTML = `${passo.produtos[0].cta} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
        conteudo.appendChild(cta);

        card.appendChild(imgs);
        card.appendChild(conteudo);
        cont.appendChild(card);
      });
    }

    // ============================================================
    // ORQUESTRADOR DA ANIMAÇÃO
    // ============================================================
    // Timeline (ms) — total aproximado: ~12s pra Jornada 2 (3 painéis)
    const T = {
      tituloIn:      { start:  300, dur: 800 },
      hexIn:         { start: 1100, dur: 1000, stagger: 130 },
      hexHold:       { start: 2400, dur: 1200 },
      tituloOut:     { start: 3400, dur: 500 },
      hexOut:        { start: 3500, dur: 700, stagger: 70 },
      // Painéis: cada um dura 2300ms (entra 600 + segura 1300 + sai 400)
      painelEnter:   600,
      painelHold:    1500,
      painelExit:    500,
      painelOverlap: 350,  // sobreposição entre exit do anterior e entrada do próximo
      paineisStart:  3900,
      // Final
      finalIn:       700,
      bolinhasIn:    600,
      bolinhasStagger: 80,
      hintIn:        400,
    };

    let animacoesAtivas = [];
    function track(a) { animacoesAtivas.push(a); return a; }
    function cancelarTudo() {
      animacoesAtivas.forEach(a => { try { a.cancel(); } catch (_) {} });
      animacoesAtivas = [];
    }

    function resetEstado() {
      document.getElementById('titulo-topo').style.opacity = '0';
      document.getElementById('titulo-topo').style.transform = 'translateX(-50%) translateY(-10px)';
      document.querySelectorAll('.bolha').forEach(b => {
        b.style.transform = `translate(0, 0) scale(0)`;
        b.style.opacity = '0';
        b.style.filter = 'blur(0)';
      });
      document.querySelectorAll('.painel').forEach(p => {
        p.style.transform = 'translate(-50%, -50%) translateY(-120vh) scale(0.95)';
        p.style.opacity = '0';
        p.style.filter = 'blur(8px)';
      });
      document.getElementById('final').style.opacity = '0';
      document.getElementById('final').classList.remove('visivel');
      document.querySelectorAll('.bolinha-final').forEach(b => {
        b.style.opacity = '0';
        b.style.transform = 'scale(0.6) translateY(20px)';
      });
      document.getElementById('scroll-hint').classList.remove('visivel');
      document.getElementById('btn-rever').classList.remove('visivel');
    }

    async function tocarAnimacao() {
      cancelarTudo();
      resetEstado();
      await new Promise(r => requestAnimationFrame(r));

      const titulo = document.getElementById('titulo-topo');
      const bolhas = Array.from(document.querySelectorAll('.bolha'));
      const paineis = Array.from(document.querySelectorAll('.painel'));
      const finalEl = document.getElementById('final');
      const bolinhas = Array.from(document.querySelectorAll('.bolinha-final'));
      const hint = document.getElementById('scroll-hint');
      const btnRever = document.getElementById('btn-rever');

      // FASE 1 — Título do topo aparece
      track(titulo.animate([
        { opacity: 0, transform: 'translateX(-50%) translateY(-10px)' },
        { opacity: 1, transform: 'translateX(-50%) translateY(0)' },
      ], {
        duration: T.tituloIn.dur,
        delay: T.tituloIn.start,
        easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
        fill: 'forwards',
      }));

      // FASE 2 — Hexágono entra com stagger
      bolhas.forEach((b, i) => {
        const x = parseFloat(b.dataset.x);
        const y = parseFloat(b.dataset.y);
        track(b.animate([
          { transform: 'translate(0,0) scale(0)', opacity: 0 },
          { transform: `translate(${x}px, ${y}px) scale(1.1)`, opacity: 1, offset: 0.7 },
          { transform: `translate(${x}px, ${y}px) scale(1)`, opacity: 1 },
        ], {
          duration: T.hexIn.dur,
          delay: T.hexIn.start + i * T.hexIn.stagger,
          easing: 'cubic-bezier(0.22, 1.2, 0.36, 1)',
          fill: 'forwards',
        }));
      });

      // FASE 3 — Título sai + Hexágono dispersa
      track(titulo.animate([
        { opacity: 1, transform: 'translateX(-50%) translateY(0)' },
        { opacity: 0, transform: 'translateX(-50%) translateY(-12px)' },
      ], {
        duration: T.tituloOut.dur,
        delay: T.tituloOut.start,
        easing: 'cubic-bezier(0.7, 0, 0.84, 0)',
        fill: 'forwards',
      }));

      bolhas.forEach((b, i) => {
        const x = parseFloat(b.dataset.x);
        const y = parseFloat(b.dataset.y);
        track(b.animate([
          { transform: `translate(${x}px, ${y}px) scale(1)`, opacity: 1, filter: 'blur(0)' },
          { transform: `translate(${x * 1.7}px, ${y * 1.7}px) scale(1.4)`, opacity: 0, filter: 'blur(12px)' },
        ], {
          duration: T.hexOut.dur,
          delay: T.hexOut.start + i * T.hexOut.stagger,
          easing: 'cubic-bezier(0.7, 0, 0.84, 0)',
          fill: 'forwards',
        }));
      });

      // FASE 4 — Painéis descem de cima → centro → saem por baixo
      const cicloPainel = T.painelEnter + T.painelHold + T.painelExit;
      const stridePainel = T.painelEnter + T.painelHold - T.painelOverlap;

      paineis.forEach((p, i) => {
        const delay = T.paineisStart + i * stridePainel;
        track(p.animate([
          // entrada de CIMA (top)
          { transform: 'translate(-50%, -50%) translateY(-120vh) scale(0.95)', opacity: 0, filter: 'blur(8px)', offset: 0 },
          // foco no centro
          { transform: 'translate(-50%, -50%) translateY(0) scale(1)',          opacity: 1, filter: 'blur(0)',  offset: T.painelEnter / cicloPainel },
          // segura no centro
          { transform: 'translate(-50%, -50%) translateY(2vh) scale(1)',        opacity: 1, filter: 'blur(0)',  offset: (T.painelEnter + T.painelHold) / cicloPainel },
          // saída pra BAIXO (bottom)
          { transform: 'translate(-50%, -50%) translateY(120vh) scale(0.95)',   opacity: 0, filter: 'blur(8px)', offset: 1 },
        ], {
          duration: cicloPainel,
          delay,
          easing: 'cubic-bezier(0.5, 0, 0.5, 1)',
          fill: 'forwards',
        }));
      });

      // FASE 5 — Final: row de bolinhas + texto novo
      const fimPaineis = T.paineisStart + (paineis.length - 1) * stridePainel + T.painelEnter + T.painelHold;
      const tFinal = fimPaineis;

      setTimeout(() => {
        // Cancela últimas saídas pra ficar limpo
        track(finalEl.animate([
          { opacity: 0 },
          { opacity: 1 },
        ], { duration: T.finalIn, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' }));
        finalEl.classList.add('visivel');
      }, tFinal);

      // Bolinhas finais entram com stagger
      bolinhas.forEach((b, i) => {
        setTimeout(() => {
          track(b.animate([
            { opacity: 0, transform: 'scale(0.6) translateY(20px)' },
            { opacity: 1, transform: 'scale(1.1) translateY(-4px)', offset: 0.7 },
            { opacity: 1, transform: 'scale(1) translateY(0)' },
          ], {
            duration: T.bolinhasIn,
            easing: 'cubic-bezier(0.22, 1.2, 0.36, 1)',
            fill: 'forwards',
          }));
        }, tFinal + T.finalIn / 2 + i * T.bolinhasStagger);
      });

      const tHint = tFinal + T.finalIn + bolinhas.length * T.bolinhasStagger + 300;
      setTimeout(() => {
        document.getElementById('scroll-hint').classList.add('visivel');
        btnRever.classList.add('visivel');
      }, tHint);
    }

    // ============================================================
    // BOOT
    // ============================================================
    function reconstruir() {
      preencherTextoFixo();
      criarHexagono();
      criarPaineis();
      criarRowBolinhas();
    }

    preencherTextoFixo();
    criarParticulas();
    reconstruir();
    criarPassosDetalhes();

    // Espera imagens carregarem antes de tocar
    let imgsCarregadas = 0;
    const todasImgs = document.querySelectorAll('.hero img, .bolinha-final img');
    function tentarTocar() {
      imgsCarregadas++;
      if (imgsCarregadas >= todasImgs.length) {
        setTimeout(tocarAnimacao, 200);
      }
    }
    if (todasImgs.length === 0) {
      setTimeout(tocarAnimacao, 200);
    } else {
      todasImgs.forEach(img => {
        if (img.complete) tentarTocar();
        else {
          img.addEventListener('load',  tentarTocar, { once: true });
          img.addEventListener('error', tentarTocar, { once: true });
        }
      });
    }
    setTimeout(() => {
      if (imgsCarregadas < todasImgs.length) tocarAnimacao();
    }, 2500);

    document.getElementById('btn-rever').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(tocarAnimacao, 400);
    });

    // Resize debounced
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        reconstruir();
        tocarAnimacao();
      }, 350);
    });
  </script>
