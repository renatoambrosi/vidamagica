<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sua Jornada — Vida Mágica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!--
    ============================================================
    VIDA MÁGICA — jornada-animacao-teste.html (v3)
    Página de revelação da jornada da aluna.

    MODELO: o MATERIAL é a unidade (não o passo).
      N materiais = N bolinhas = N painéis = N cards estáticos.
      Guia Prático e Mágica do Fluir são materiais SEPARADOS.

    ESTRUTURA:
      1. HERO com animação intro:
         - título fixo no topo
         - círculo de N bolinhas (só os materiais da jornada)
         - reveal: cada material num painel, centro estável
         - final: bolinhas viram uma row clicável, ligando à seção abaixo
      2. Seção HTML estática: 1 card por material (foto + descritivo + CTA)

    ESTABILIDADE: tudo da animação ancora no MESMO centro vertical
      (--palco-y). Painéis têm drift pequeno (entram de cima, saem
      por baixo) pra dar movimento sem "pular" pela tela.

    Paleta + tipografia = tokens do app.css.
    Implementação CSS + Web Animations API.
    ============================================================
  -->

  <style>
    :root {
      --ouro: #C8922A;
      --ouro-claro: #E8C97A;
      --ouro-brilho: #F4D998;
      --ouro-fundo: #A17523;
      --ouro-pelicula: rgba(200, 146, 42, 0.12);
      --texto: #3D2E1A;
      --texto-suave: #6B5436;
      --texto-mute: rgba(61, 46, 26, 0.55);
      --vidro: rgba(255, 250, 240, 0.75);
      --vidro-forte: rgba(255, 250, 240, 0.92);
      --vidro-borda: rgba(200, 146, 42, 0.22);
      --vidro-borda-hi: rgba(200, 146, 42, 0.5);
      --sombra-suave: 0 2px 12px rgba(161, 117, 35, 0.08);
      --sombra-media: 0 4px 24px rgba(161, 117, 35, 0.14);
      --sombra-forte: 0 12px 48px rgba(161, 117, 35, 0.22);
      --glow-ouro: 0 0 24px rgba(200, 146, 42, 0.35), 0 0 48px rgba(200, 146, 42, 0.18);
      --glow-ouro-forte: 0 0 36px rgba(200, 146, 42, 0.55), 0 0 96px rgba(244, 217, 152, 0.35);
      --font-display: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Lora', Georgia, serif;
      --hero-grad: radial-gradient(ellipse at 50% 30%, #fff9eb 0%, #f5ead0 55%, #e6d2a2 100%);

      /* Centro vertical do "palco" — TUDO da animação ancora aqui */
      --palco-y: 54%;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #f3e6c8;
      color: var(--texto);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100%;
    }
    body { overflow-x: hidden; }

    /* ===========================================
       HERO
       =========================================== */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 600px;
      overflow: hidden;
      background: var(--hero-grad);
    }

    .particulas {
      position: absolute; inset: 0;
      pointer-events: none; overflow: hidden; z-index: 1;
    }
    .particula {
      position: absolute;
      width: 4px; height: 4px; border-radius: 50%;
      background: radial-gradient(circle, var(--ouro-brilho) 0%, transparent 70%);
      opacity: 0; will-change: transform, opacity;
      animation: flutuar linear infinite;
    }
    @keyframes flutuar {
      0%   { transform: translate(0, 102vh) scale(0.5); opacity: 0; }
      10%  { opacity: 0.55; }
      90%  { opacity: 0.55; }
      100% { transform: translate(40px, -8vh) scale(1.2); opacity: 0; }
    }

    .hero-stage { position: relative; width: 100%; height: 100%; z-index: 2; }

    /* ===== TÍTULO FIXO NO TOPO ===== */
    .titulo-topo {
      position: absolute;
      left: 50%; top: 9%;
      transform: translateX(-50%);
      text-align: center;
      width: 92%; max-width: 900px;
      opacity: 0;
      will-change: opacity, transform;
      z-index: 8;
      pointer-events: none;
    }
    .titulo-eyebrow {
      font-family: var(--font-body); font-style: italic;
      color: var(--texto-suave); letter-spacing: 0.04em;
      font-size: clamp(13px, 1.6vw, 19px); margin-bottom: 8px;
    }
    .titulo-nome {
      font-family: var(--font-display); font-weight: 700;
      letter-spacing: 0.005em; line-height: 1.05;
      font-size: clamp(30px, 5.2vw, 60px);
      background: linear-gradient(135deg, var(--ouro-fundo) 0%, var(--ouro-brilho) 50%, var(--ouro-fundo) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 16px rgba(200, 146, 42, 0.3));
    }
    .titulo-sublinha {
      font-family: var(--font-body); font-style: italic;
      color: var(--texto-suave);
      font-size: clamp(13px, 1.4vw, 17px); margin-top: 10px; opacity: 0.85;
    }

    /* ===== CÍRCULO DE BOLINHAS (intro) ===== */
    /* Ancorado no --palco-y */
    .circulo {
      position: absolute;
      left: 50%; top: var(--palco-y);
      transform: translate(-50%, -50%);
      width: 100%; max-width: 520px;
      aspect-ratio: 1 / 1;
      pointer-events: none;
      z-index: 3;
    }
    .bolha {
      position: absolute;
      left: 50%; top: 50%;
      width: var(--size, 120px); height: var(--size, 120px);
      margin-left: calc(var(--size, 120px) / -2);
      margin-top: calc(var(--size, 120px) / -2);
      border-radius: 50%; overflow: hidden;
      border: 2px solid var(--vidro-borda-hi);
      box-shadow: var(--glow-ouro), var(--sombra-media);
      background: var(--vidro-forte);
      opacity: 0;
      will-change: transform, opacity, filter;
    }
    .bolha img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ===== PAINEL (reveal de cada material) ===== */
    /* Ancorado no MESMO --palco-y. Drift pequeno (entra de cima, sai por baixo). */
    .paineis { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
    .painel {
      position: absolute;
      left: 50%; top: var(--palco-y);
      transform: translate(-50%, -50%) translateY(-10vh) scale(0.96);
      width: 92%; max-width: 860px; max-height: 78vh;
      opacity: 0; filter: blur(4px);
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      align-items: center;
      gap: clamp(20px, 4vw, 52px);
      padding: clamp(20px, 3vw, 36px);
      background: var(--vidro-forte);
      border: 1.5px solid var(--vidro-borda-hi);
      border-radius: 28px;
      box-shadow: var(--glow-ouro-forte), var(--sombra-forte);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      will-change: transform, opacity, filter;
    }
    .painel-imagem { display: flex; justify-content: center; align-items: center; }
    .painel-imagem .capa {
      width: 100%; max-width: 260px; aspect-ratio: 1 / 1;
      border-radius: 18px; overflow: hidden;
      box-shadow: var(--sombra-forte);
      border: 2px solid var(--vidro-borda-hi);
    }
    .painel-imagem .capa img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .painel-texto { display: flex; flex-direction: column; gap: 14px; }
    .painel-passo-tag {
      display: inline-flex; align-items: center; align-self: flex-start; gap: 8px;
      font-family: var(--font-display); font-weight: 600;
      font-size: clamp(11px, 1.1vw, 13px); text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--ouro-fundo);
      padding: 6px 14px; background: var(--ouro-pelicula);
      border: 1px solid var(--vidro-borda); border-radius: 999px;
    }
    .painel-passo-tag .num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%;
      background: linear-gradient(135deg, var(--ouro-fundo), var(--ouro-claro));
      color: #fff; font-size: 11px;
    }
    .painel-titulo {
      font-family: var(--font-display); font-weight: 700;
      font-size: clamp(26px, 4vw, 44px); line-height: 1.06; letter-spacing: 0.005em;
      background: linear-gradient(135deg, var(--ouro-fundo) 0%, var(--ouro-brilho) 60%, var(--ouro-fundo) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .painel-produto-nome {
      font-family: var(--font-display); font-weight: 600;
      color: var(--texto); font-size: clamp(15px, 1.6vw, 19px); line-height: 1.3;
    }
    .painel-descricao {
      font-family: var(--font-body); color: var(--texto-suave);
      font-size: clamp(14px, 1.5vw, 18px); line-height: 1.55;
    }

    /* ===== FINAL — bolinhas clicáveis em row ===== */
    /* Posicionado mais ALTO (não no centro) pra LIGAR com a seção abaixo. */
    .final {
      position: absolute;
      left: 0; right: 0;
      top: 0; bottom: 0;
      z-index: 7;
      pointer-events: none;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(14px, 2.4vh, 26px);
      padding: 0 24px;
      opacity: 0;
    }
    .final.visivel { pointer-events: auto; }
    .final-eyebrow {
      font-family: var(--font-body); font-style: italic;
      color: var(--texto-suave); font-size: clamp(13px, 1.5vw, 18px); letter-spacing: 0.04em;
    }
    .final-titulo {
      font-family: var(--font-display); font-weight: 700;
      font-size: clamp(28px, 4.5vw, 54px); line-height: 1.05;
      background: linear-gradient(135deg, var(--ouro-fundo), var(--ouro-brilho) 50%, var(--ouro-fundo));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-align: center; filter: drop-shadow(0 0 14px rgba(200, 146, 42, 0.25));
    }
    .final-subtitulo {
      font-family: var(--font-body); color: var(--texto-suave);
      font-size: clamp(14px, 1.6vw, 19px); text-align: center; max-width: 640px;
    }
    .row-bolinhas {
      display: flex; gap: clamp(10px, 1.6vw, 20px);
      flex-wrap: wrap; justify-content: center; align-items: center;
      margin-top: 6px; max-width: 92vw;
    }
    .bolinha-final {
      position: relative;
      width: clamp(68px, 10vw, 120px); height: clamp(68px, 10vw, 120px);
      border-radius: 50%; overflow: hidden;
      border: 2px solid var(--vidro-borda-hi);
      box-shadow: var(--glow-ouro), var(--sombra-media);
      background: var(--vidro-forte);
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
      opacity: 0; transform: scale(0.6) translateY(20px);
      will-change: transform, opacity; padding: 0; flex: 0 0 auto;
    }
    .bolinha-final img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .bolinha-final:hover { transform: scale(1.08); box-shadow: var(--glow-ouro-forte), var(--sombra-forte); }
    .bolinha-final:active { transform: scale(0.96); }

    .scroll-hint {
      position: absolute; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      font-family: var(--font-body); font-style: italic;
      color: var(--texto-mute); font-size: clamp(12px, 1.3vw, 15px);
      opacity: 0; pointer-events: none;
      animation: pulse-hint 2.2s ease-in-out infinite; animation-play-state: paused;
    }
    .scroll-hint.visivel { opacity: 1; animation-play-state: running; }
    .scroll-hint svg { width: 22px; height: 22px; stroke: var(--texto-mute); }
    @keyframes pulse-hint {
      0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.7; }
      50%      { transform: translateX(-50%) translateY(6px); opacity: 1; }
    }

    .btn-rever {
      position: fixed; top: 18px; right: 18px;
      background: var(--vidro-forte); border: 1px solid var(--vidro-borda-hi);
      color: var(--texto); padding: 9px 16px 9px 12px; border-radius: 999px;
      font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.03em;
      cursor: pointer; opacity: 0;
      transition: opacity 0.5s ease, transform 0.18s ease;
      z-index: 99; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-rever.visivel { opacity: 1; }
    .btn-rever:hover { transform: scale(1.04); }
    .btn-rever:active { transform: scale(0.96); }
    .btn-rever svg { width: 13px; height: 13px; }

    /* ===========================================
       SEÇÃO ESTÁTICA — 1 card por material
       =========================================== */
    .secao-materiais {
      background: linear-gradient(180deg, #faf2dd 0%, #f3e6c8 100%);
      padding: clamp(56px, 7vw, 110px) 24px clamp(80px, 10vw, 140px);
      position: relative;
    }
    .secao-materiais::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 60px;
      background: linear-gradient(180deg, rgba(230, 210, 162, 0.4), transparent);
      pointer-events: none;
    }
    .container { width: 100%; max-width: 980px; margin: 0 auto; }
    .secao-eyebrow {
      font-family: var(--font-body); font-style: italic; color: var(--texto-suave);
      font-size: clamp(13px, 1.5vw, 18px); letter-spacing: 0.04em; text-align: center; margin-bottom: 12px;
    }
    .secao-titulo {
      font-family: var(--font-display); font-weight: 700; color: var(--texto);
      font-size: clamp(26px, 3.6vw, 42px); line-height: 1.15; letter-spacing: 0.005em;
      text-align: center; margin-bottom: clamp(40px, 5vw, 64px);
    }
    .secao-titulo .ouro {
      background: linear-gradient(135deg, var(--ouro-fundo), var(--ouro-brilho) 50%, var(--ouro-fundo));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .material-card {
      display: grid; grid-template-columns: 0.9fr 1.2fr;
      gap: clamp(24px, 3.5vw, 48px); align-items: center;
      padding: clamp(24px, 3.5vw, 44px);
      background: var(--vidro-forte);
      border: 1.5px solid var(--vidro-borda); border-radius: 28px;
      box-shadow: var(--sombra-media);
      margin-bottom: clamp(24px, 3.5vw, 44px);
      scroll-margin-top: 40px;
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .material-card:hover, .material-card.destacado {
      box-shadow: var(--glow-ouro), var(--sombra-forte); border-color: var(--vidro-borda-hi);
    }
    .material-card-imagem { display: flex; justify-content: center; align-items: center; }
    .material-card-imagem .capa {
      width: 100%; max-width: 240px; aspect-ratio: 1 / 1;
      border-radius: 18px; overflow: hidden;
      box-shadow: var(--sombra-media); border: 1.5px solid var(--vidro-borda);
    }
    .material-card-imagem .capa img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .material-card-conteudo h3 {
      font-family: var(--font-display); font-weight: 700; color: var(--ouro-fundo);
      font-size: clamp(22px, 2.8vw, 32px); line-height: 1.1; margin-bottom: 6px; letter-spacing: 0.005em;
    }
    .material-card-tag {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font-display); font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.14em; color: var(--ouro-fundo);
      padding: 5px 12px; background: var(--ouro-pelicula);
      border: 1px solid var(--vidro-borda); border-radius: 999px; margin-bottom: 14px;
    }
    .material-card-tag .num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 50%;
      background: linear-gradient(135deg, var(--ouro-fundo), var(--ouro-claro));
      color: #fff; font-size: 10px;
    }
    .material-card-produto-nome {
      font-family: var(--font-display); font-weight: 600; color: var(--texto);
      font-size: clamp(15px, 1.6vw, 19px); margin-bottom: 12px; line-height: 1.3;
    }
    .material-card-descricao {
      font-family: var(--font-body); color: var(--texto-suave);
      font-size: clamp(15px, 1.6vw, 18px); line-height: 1.6; margin-bottom: 22px;
    }
    .material-card-cta {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px;
      background: linear-gradient(135deg, var(--ouro-fundo), var(--ouro));
      color: #fff; border: none; border-radius: 999px;
      font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: 0.02em;
      cursor: pointer; text-decoration: none;
      box-shadow: var(--sombra-media);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .material-card-cta:hover { transform: translateY(-2px); box-shadow: var(--glow-ouro), var(--sombra-forte); }
    .material-card-cta:active { transform: translateY(0); }
    .material-card-cta svg { width: 14px; height: 14px; }

    /* ===========================================
       Mobile
       =========================================== */
    @media (max-aspect-ratio: 1/1), (max-width: 720px) {
      :root { --palco-y: 56%; }
      .titulo-topo { top: 7%; }
      .titulo-nome { font-size: clamp(28px, 8vw, 44px); }
      .circulo { max-width: 86vw; }
      .painel { grid-template-columns: 1fr; max-width: 88vw; gap: 16px; max-height: 82vh; }
      .painel-imagem .capa { max-width: 190px; }
      .material-card { grid-template-columns: 1fr; text-align: center; }
      .material-card-imagem .capa { max-width: 200px; }
      .material-card-tag { align-self: center; margin-left: auto; margin-right: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      .particula { animation: none; opacity: 0.3; }
      .scroll-hint { animation: none; }
    }
  </style>
</head>

<body>
  <section class="hero" id="hero">
    <div class="particulas" id="particulas" aria-hidden="true"></div>

    <div class="hero-stage" id="stage">
      <div class="titulo-topo" id="titulo-topo">
        <p class="titulo-eyebrow" id="titulo-eyebrow">A sua jornada começa</p>
        <h1 class="titulo-nome" id="titulo-nome">Vida Mágica</h1>
        <p class="titulo-sublinha" id="titulo-sublinha">Estes são os materiais do seu caminho</p>
      </div>

      <div class="circulo" id="circulo"></div>

      <div class="paineis" id="paineis"></div>

      <div class="final" id="final">
        <p class="final-eyebrow">Sua jornada</p>
        <h2 class="final-titulo" id="final-titulo">Vida Mágica</h2>
        <p class="final-subtitulo" id="final-subtitulo">Toque em qualquer material pra conhecer melhor</p>
        <div class="row-bolinhas" id="row-bolinhas"></div>
      </div>

      <div class="scroll-hint" id="scroll-hint">
        <span>role pra ver cada material</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="7 13 12 18 17 13"></polyline>
          <polyline points="7 7 12 12 17 7"></polyline>
        </svg>
      </div>
    </div>

    <button class="btn-rever" id="btn-rever" type="button" aria-label="Rever animação">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 3-6.7"></path>
        <polyline points="3 4 3 10 9 10"></polyline>
      </svg>
      Rever
    </button>
  </section>

  <section class="secao-materiais">
    <div class="container">
      <p class="secao-eyebrow">Sua trilha em detalhe</p>
      <h2 class="secao-titulo">Os materiais da <span class="ouro" id="secao-titulo-jornada">Vida Mágica</span></h2>
      <div id="materiais-lista"></div>
    </div>
  </section>

  <script>
    'use strict';

    // ============================================================
    // DADOS — o MATERIAL é a unidade (cada produto = 1 item)
    // Depois vem de /api/app/contexto.
    // passo/passoTag são só rótulo: vários materiais podem ter o mesmo passo.
    // ============================================================
    const JORNADAS = {
      conhecer_e_despertar: {
        nome: 'Conhecer e Despertar',
        eyebrow: 'A sua jornada começa',
        sublinha: 'Estes são os materiais do seu caminho',
        finalSubtitulo: 'Toque em qualquer material pra conhecer melhor',
        materiais: [
          { slug:'teste_subconsciente', passo:1, passoTag:'Conhecer',      nome:'Teste do Subconsciente', titulo:'O ponto de partida', descricao:'O retrato fiel do que está hoje funcionando dentro de você — e do que precisa ser despertado.', imagem:'/assets/products/teste-subconsciente.webp', cta:'Refazer o teste' },
          { slug:'vencendo_medo',       passo:2, passoTag:'Despertar',     nome:'Vencendo o Medo',        titulo:'Despertar começa aqui', descricao:'O livro da Série Conhecer e Despertar que trabalha a energia do medo.', imagem:'/assets/products/ebook-vencendoomedo.webp', cta:'Conhecer o livro' },
          { slug:'vencendo_desordem',   passo:2, passoTag:'Despertar',     nome:'Vencendo a Desordem',    titulo:'Organizar por dentro', descricao:'O livro que trabalha a energia da desordem — pra dentro e pra fora.', imagem:'/assets/products/ebook-vencendoadesordem.webp', cta:'Conhecer o livro' },
          { slug:'ouro_reprogramacao',  passo:3, passoTag:'Reprogramação', nome:'Curso Ouro da Reprogramação Mental', titulo:'A reprogramação definitiva', descricao:'O passo que fecha a primeira jornada e prepara a próxima.', imagem:'/assets/products/ouro-reprogramacao.webp', cta:'Conhecer o curso' },
        ],
      },

      vida_magica: {
        nome: 'Vida Mágica',
        eyebrow: 'A sua jornada começa',
        sublinha: 'Estes são os materiais do seu caminho',
        finalSubtitulo: 'Toque em qualquer material pra conhecer melhor',
        materiais: [
          { slug:'lda_biblica',        passo:1, passoTag:'Reprogramação',  nome:'Curso Lei da Atração Bíblica',          titulo:'A base que recria sua mente', descricao:'O curso que vai reescrever os padrões que você nem sabia que tinha. Tudo começa aqui.', imagem:'/assets/products/lda-biblica.webp', cta:'Conhecer o curso' },
          { slug:'guia_pratico',       passo:2, passoTag:'Prática diária', nome:'Guia Prático para Reprogramar a Mente', titulo:'A prática que vira rotina',   descricao:'Práticas curtas e diárias pra manter a reprogramação viva no dia a dia.', imagem:'/assets/products/guia-pratico.webp', cta:'Ver o guia' },
          { slug:'magica_fluir',       passo:2, passoTag:'Prática diária', nome:'Guia de Bolso Mágica do Fluir',         titulo:'O fluir na palma da mão',    descricao:'Um guia de bolso pra destravar o fluxo sempre que precisar, em qualquer lugar.', imagem:'/assets/products/magica-fluir.webp', cta:'Ver o guia de bolso' },
          { slug:'atal_maneira_livro', passo:3, passoTag:'Aprofundamento', nome:'Livro Digital A Tal Maneira',           titulo:'O próximo nível se abre',    descricao:'O livro que é a ponte pra Multiplicando a Vida Mágica. A próxima jornada começa aqui.', imagem:'/assets/products/atal-maneira-livro.webp', cta:'Conhecer o livro' },
        ],
      },

      multiplicando_vida_magica: {
        nome: 'Multiplicando a Vida Mágica',
        eyebrow: 'Você chegou na última jornada',
        sublinha: 'Um material. Tudo o que falta pra multiplicar.',
        finalSubtitulo: 'Toque pra conhecer o curso definitivo',
        materiais: [
          { slug:'atal_maneira_curso', passo:1, passoTag:'Multiplicar', nome:'Curso A Tal Maneira', titulo:'O curso definitivo da riqueza bíblica', descricao:'O curso que finaliza sua jornada — e abre a porta da multiplicação. Você chegou porque já está pronta.', imagem:'/assets/products/atal-maneira-curso.webp', cta:'Conhecer o curso' },
        ],
      },
    };

    const params = new URLSearchParams(location.search);
    const jornadaSlug = params.get('j') || 'vida_magica';
    const JORNADA = JORNADAS[jornadaSlug] || JORNADAS.vida_magica;
    const MATERIAIS = JORNADA.materiais;
    const N = MATERIAIS.length;

    // ============================================================
    // SETUP
    // ============================================================
    function preencherTextoFixo() {
      document.getElementById('titulo-eyebrow').textContent = JORNADA.eyebrow;
      document.getElementById('titulo-nome').textContent = JORNADA.nome;
      document.getElementById('titulo-sublinha').textContent = JORNADA.sublinha;
      document.getElementById('final-titulo').textContent = JORNADA.nome;
      document.getElementById('final-subtitulo').textContent = JORNADA.finalSubtitulo;
      document.getElementById('secao-titulo-jornada').textContent = JORNADA.nome;
    }

    function criarParticulas() {
      const c = document.getElementById('particulas');
      c.innerHTML = '';
      for (let i = 0; i < 28; i++) {
        const p = document.createElement('div');
        p.className = 'particula';
        p.style.left = `${Math.random() * 100}%`;
        const dur = 12 + Math.random() * 14;
        p.style.animationDuration = `${dur}s`;
        p.style.animationDelay = `-${Math.random() * dur}s`;
        p.style.transform = `scale(${0.5 + Math.random() * 1.3})`;
        c.appendChild(p);
      }
    }

    // Círculo adaptativo: N bolinhas (só os materiais), distribuídas no círculo.
    function criarCirculo() {
      const cont = document.getElementById('circulo');
      cont.innerHTML = '';
      const w = cont.clientWidth, h = cont.clientHeight;
      const lado = Math.min(w, h);

      // tamanho da bolinha encolhe conforme aumenta N (pra não colidir)
      const fator = N <= 2 ? 0.30 : N <= 4 ? 0.26 : 0.22;
      const bolhaSz = Math.min(140, lado * fator);
      // raio do círculo (0 se só 1 material → fica no centro)
      const raio = N === 1 ? 0 : lado * (N <= 4 ? 0.33 : 0.36);

      const bolhas = [];
      for (let i = 0; i < N; i++) {
        const ang = (i / N) * 2 * Math.PI - Math.PI / 2; // começa do topo
        const x = N === 1 ? 0 : Math.cos(ang) * raio;
        const y = N === 1 ? 0 : Math.sin(ang) * raio;

        const b = document.createElement('div');
        b.className = 'bolha';
        b.style.setProperty('--size', `${bolhaSz}px`);
        b.dataset.x = x.toFixed(1);
        b.dataset.y = y.toFixed(1);
        const img = document.createElement('img');
        img.src = MATERIAIS[i].imagem;
        img.alt = MATERIAIS[i].nome;
        b.appendChild(img);
        cont.appendChild(b);
        bolhas.push(b);
      }
      return bolhas;
    }

    function criarPaineis() {
      const cont = document.getElementById('paineis');
      cont.innerHTML = '';
      MATERIAIS.forEach((mat, idx) => {
        const painel = document.createElement('div');
        painel.className = 'painel';
        painel.dataset.idx = idx;

        const imgCont = document.createElement('div');
        imgCont.className = 'painel-imagem';
        const capa = document.createElement('div');
        capa.className = 'capa';
        const img = document.createElement('img');
        img.src = mat.imagem; img.alt = mat.nome;
        capa.appendChild(img);
        imgCont.appendChild(capa);

        const texto = document.createElement('div');
        texto.className = 'painel-texto';
        texto.innerHTML = `
          <div class="painel-passo-tag"><span class="num">${mat.passo}</span> ${mat.passoTag}</div>
          <div class="painel-titulo">${mat.titulo}</div>
          <div class="painel-produto-nome">${mat.nome}</div>
          <div class="painel-descricao">${mat.descricao}</div>
        `;

        painel.appendChild(imgCont);
        painel.appendChild(texto);
        cont.appendChild(painel);
      });
    }

    function criarRowBolinhas() {
      const row = document.getElementById('row-bolinhas');
      row.innerHTML = '';
      MATERIAIS.forEach((mat) => {
        const b = document.createElement('button');
        b.className = 'bolinha-final';
        b.title = mat.nome;
        b.setAttribute('aria-label', mat.nome);
        const img = document.createElement('img');
        img.src = mat.imagem; img.alt = mat.nome;
        b.appendChild(img);
        b.addEventListener('click', () => {
          const alvo = document.querySelector(`[data-mat-slug="${mat.slug}"]`);
          if (alvo) {
            alvo.scrollIntoView({ behavior: 'smooth', block: 'center' });
            alvo.classList.add('destacado');
            setTimeout(() => alvo.classList.remove('destacado'), 2200);
          }
        });
        row.appendChild(b);
      });
    }

    function criarMateriaisDetalhes() {
      const cont = document.getElementById('materiais-lista');
      cont.innerHTML = '';
      MATERIAIS.forEach((mat) => {
        const card = document.createElement('article');
        card.className = 'material-card';
        card.setAttribute('data-mat-slug', mat.slug);
        card.innerHTML = `
          <div class="material-card-imagem">
            <div class="capa"><img src="${mat.imagem}" alt="${mat.nome}"></div>
          </div>
          <div class="material-card-conteudo">
            <div class="material-card-tag"><span class="num">${mat.passo}</span> Passo ${mat.passo} — ${mat.passoTag}</div>
            <h3>${mat.titulo}</h3>
            <div class="material-card-produto-nome">${mat.nome}</div>
            <p class="material-card-descricao">${mat.descricao}</p>
            <a class="material-card-cta" href="#">${mat.cta}
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </a>
          </div>
        `;
        cont.appendChild(card);
      });
    }

    // ============================================================
    // ORQUESTRADOR
    // ============================================================
    const T = {
      tituloIn:   { start: 300,  dur: 800 },
      circuloIn:  { start: 1100, dur: 950, stagger: 120 },
      circuloHold:{ dur: 1100 },
      tituloOut:  { dur: 450 },
      circuloOut: { dur: 650, stagger: 60 },
      painelEnter: 600,
      painelHold:  1400,
      painelExit:  450,
      painelOverlap: 250,
      finalIn:     700,
      bolinhasIn:  600,
      bolinhasStagger: 90,
    };

    let animacoes = [];
    const track = a => { animacoes.push(a); return a; };
    function cancelarTudo() { animacoes.forEach(a => { try { a.cancel(); } catch (_) {} }); animacoes = []; }

    function resetEstado() {
      const t = document.getElementById('titulo-topo');
      t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(-10px)';
      document.querySelectorAll('.bolha').forEach(b => {
        b.style.transform = 'translate(0,0) scale(0)'; b.style.opacity = '0'; b.style.filter = 'blur(0)';
      });
      document.querySelectorAll('.painel').forEach(p => {
        p.style.transform = 'translate(-50%, -50%) translateY(-10vh) scale(0.96)';
        p.style.opacity = '0'; p.style.filter = 'blur(4px)';
      });
      const f = document.getElementById('final');
      f.style.opacity = '0'; f.classList.remove('visivel');
      document.querySelectorAll('.bolinha-final').forEach(b => {
        b.style.opacity = '0'; b.style.transform = 'scale(0.6) translateY(20px)';
      });
      document.getElementById('scroll-hint').classList.remove('visivel');
      document.getElementById('btn-rever').classList.remove('visivel');
    }

    async function tocarAnimacao() {
      cancelarTudo();
      resetEstado();
      await new Promise(r => requestAnimationFrame(r));

      const titulo = document.getElementById('titulo-topo');
      const bolhas = Array.from(document.querySelectorAll('.bolha'));
      const paineis = Array.from(document.querySelectorAll('.painel'));
      const finalEl = document.getElementById('final');
      const bolinhas = Array.from(document.querySelectorAll('.bolinha-final'));
      const btnRever = document.getElementById('btn-rever');

      // FASE 1 — título topo
      track(titulo.animate([
        { opacity: 0, transform: 'translateX(-50%) translateY(-10px)' },
        { opacity: 1, transform: 'translateX(-50%) translateY(0)' },
      ], { duration: T.tituloIn.dur, delay: T.tituloIn.start, easing: 'cubic-bezier(0.16,1,0.3,1)', fill: 'forwards' }));

      // FASE 2 — círculo entra
      bolhas.forEach((b, i) => {
        const x = parseFloat(b.dataset.x), y = parseFloat(b.dataset.y);
        track(b.animate([
          { transform: 'translate(0,0) scale(0)', opacity: 0 },
          { transform: `translate(${x}px, ${y}px) scale(1.1)`, opacity: 1, offset: 0.7 },
          { transform: `translate(${x}px, ${y}px) scale(1)`, opacity: 1 },
        ], { duration: T.circuloIn.dur, delay: T.circuloIn.start + i * T.circuloIn.stagger, easing: 'cubic-bezier(0.22,1.2,0.36,1)', fill: 'forwards' }));
      });

      const fimCirculoIn = T.circuloIn.start + (N - 1) * T.circuloIn.stagger + T.circuloIn.dur;
      const inicioReveal = fimCirculoIn + T.circuloHold.dur;

      // FASE 3 — título sai + círculo dispersa
      track(titulo.animate([
        { opacity: 1, transform: 'translateX(-50%) translateY(0)' },
        { opacity: 0, transform: 'translateX(-50%) translateY(-12px)' },
      ], { duration: T.tituloOut.dur, delay: inicioReveal - 500, easing: 'cubic-bezier(0.7,0,0.84,0)', fill: 'forwards' }));

      bolhas.forEach((b, i) => {
        const x = parseFloat(b.dataset.x), y = parseFloat(b.dataset.y);
        track(b.animate([
          { transform: `translate(${x}px, ${y}px) scale(1)`, opacity: 1, filter: 'blur(0)' },
          { transform: `translate(${x * 1.5}px, ${y * 1.5}px) scale(1.3)`, opacity: 0, filter: 'blur(10px)' },
        ], { duration: T.circuloOut.dur, delay: inicioReveal - 450 + i * T.circuloOut.stagger, easing: 'cubic-bezier(0.7,0,0.84,0)', fill: 'forwards' }));
      });

      // FASE 4 — painéis (drift pequeno, centro estável)
      // stride = ciclo - overlap → troca quase sequencial: o próximo só
      // começa a entrar quando o anterior já está quase saindo (sem dois no foco).
      const ciclo = T.painelEnter + T.painelHold + T.painelExit;
      const stride = ciclo - T.painelOverlap;

      paineis.forEach((p, i) => {
        const delay = inicioReveal + i * stride;
        track(p.animate([
          { transform: 'translate(-50%, -50%) translateY(-9vh) scale(0.97)', opacity: 0, filter: 'blur(4px)', offset: 0 },
          { transform: 'translate(-50%, -50%) translateY(0) scale(1)',        opacity: 1, filter: 'blur(0)',  offset: T.painelEnter / ciclo },
          { transform: 'translate(-50%, -50%) translateY(0) scale(1)',        opacity: 1, filter: 'blur(0)',  offset: (T.painelEnter + T.painelHold) / ciclo },
          { transform: 'translate(-50%, -50%) translateY(9vh) scale(0.97)',   opacity: 0, filter: 'blur(4px)', offset: 1 },
        ], { duration: ciclo, delay, easing: 'cubic-bezier(0.45,0,0.3,1)', fill: 'forwards' }));
      });

      // FASE 5 — final
      const fimPaineis = inicioReveal + (N - 1) * stride + T.painelEnter + T.painelHold + T.painelExit * 0.5;

      setTimeout(() => {
        track(finalEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: T.finalIn, easing: 'cubic-bezier(0.16,1,0.3,1)', fill: 'forwards' }));
        finalEl.classList.add('visivel');
      }, fimPaineis);

      bolinhas.forEach((b, i) => {
        setTimeout(() => {
          track(b.animate([
            { opacity: 0, transform: 'scale(0.6) translateY(20px)' },
            { opacity: 1, transform: 'scale(1.1) translateY(-4px)', offset: 0.7 },
            { opacity: 1, transform: 'scale(1) translateY(0)' },
          ], { duration: T.bolinhasIn, easing: 'cubic-bezier(0.22,1.2,0.36,1)', fill: 'forwards' }));
        }, fimPaineis + T.finalIn / 2 + i * T.bolinhasStagger);
      });

      const tHint = fimPaineis + T.finalIn + N * T.bolinhasStagger + 300;
      setTimeout(() => {
        document.getElementById('scroll-hint').classList.add('visivel');
        btnRever.classList.add('visivel');
      }, tHint);
    }

    // ============================================================
    // BOOT
    // ============================================================
    function reconstruir() {
      preencherTextoFixo();
      criarCirculo();
      criarPaineis();
      criarRowBolinhas();
    }

    preencherTextoFixo();
    criarParticulas();
    reconstruir();
    criarMateriaisDetalhes();

    let imgsCarregadas = 0;
    const todasImgs = document.querySelectorAll('.hero img, .bolinha-final img');
    function tentarTocar() {
      imgsCarregadas++;
      if (imgsCarregadas >= todasImgs.length) setTimeout(tocarAnimacao, 200);
    }
    if (todasImgs.length === 0) setTimeout(tocarAnimacao, 200);
    else todasImgs.forEach(img => {
      if (img.complete) tentarTocar();
      else { img.addEventListener('load', tentarTocar, { once: true }); img.addEventListener('error', tentarTocar, { once: true }); }
    });
    setTimeout(() => { if (imgsCarregadas < todasImgs.length) tocarAnimacao(); }, 2500);

    document.getElementById('btn-rever').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(tocarAnimacao, 400);
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { reconstruir(); tocarAnimacao(); }, 350);
    });
  </script>
