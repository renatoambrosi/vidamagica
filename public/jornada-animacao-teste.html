<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sua Jornada — Vida Mágica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

  <!--
    ============================================================
    VIDA MÁGICA — jornada-animacao-teste.html (v6)
    Revelação da jornada da aluna.

    ARQUITETURA EM 3 CAMADAS:
      .fundo  → fixo atrás de tudo (gradiente creme + partículas douradas)
      .palco  → camada da ANIMAÇÃO (toca UMA VEZ e some). Círculo intro
                + torre (câmera voando). z-index alto, some no fim.
      .pagina → a PÁGINA REAL revelada no fim:
                  topo (textos + círculos lado a lado) NO TOPO da tela
                  + respiro mínimo + Etapa 1 logo abaixo + demais materiais.

    PLAY-ONCE: sem loop. A animação roda 1x no load. Resize só refaz
      layout (não re-toca). Botão "Rever" é só pra teste.

    CARD ÚNICO (cardInner): mesmo markup na torre e na lista.
    Passo ACIMA do material (didático). Falas curtas e conectadas.
    Paleta + tipografia = tokens do app.css.
    ============================================================
  -->

  <style>
    :root {
      --ouro: #C8922A;
      --ouro-claro: #E8C97A;
      --ouro-brilho: #F4D998;
      --ouro-fundo: #A17523;
      --ouro-pelicula: rgba(200, 146, 42, 0.12);
      --texto: #3D2E1A;
      --texto-suave: #6B5436;
      --texto-mute: rgba(61, 46, 26, 0.55);
      --vidro-forte: rgba(255, 250, 240, 0.94);
      --vidro-borda: rgba(200, 146, 42, 0.22);
      --vidro-borda-hi: rgba(200, 146, 42, 0.5);
      --sombra-media: 0 4px 24px rgba(161, 117, 35, 0.14);
      --sombra-forte: 0 12px 48px rgba(161, 117, 35, 0.22);
      --glow-ouro: 0 0 24px rgba(200, 146, 42, 0.35), 0 0 48px rgba(200, 146, 42, 0.18);
      --glow-ouro-forte: 0 0 40px rgba(200, 146, 42, 0.6), 0 0 110px rgba(244, 217, 152, 0.4);
      --verde: #2FA84F;
      --verde-fundo: #1F8A3E;
      --glow-verde: 0 0 22px rgba(47, 168, 79, 0.5), 0 0 56px rgba(47, 168, 79, 0.26);
      --font-display: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Lora', Georgia, serif;
      --hero-grad: radial-gradient(ellipse at 50% 28%, #fff9eb 0%, #f5ead0 55%, #e6d2a2 100%);
      --palco-y: 52%;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { color: var(--texto); font-family: var(--font-body); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { overflow-x: hidden; background: #f3e6c8; }
    body.travado { overflow: hidden; }

    /* ===================== FUNDO FIXO ===================== */
    .fundo { position: fixed; inset: 0; z-index: 0; background: var(--hero-grad); overflow: hidden; }
    .particulas { position: absolute; inset: 0; pointer-events: none; }
    .particula {
      position: absolute; width: 4px; height: 4px; border-radius: 50%;
      background: radial-gradient(circle, var(--ouro-brilho) 0%, transparent 70%);
      opacity: 0; will-change: transform, opacity; animation: flutuar linear infinite;
    }
    @keyframes flutuar { 0%{transform:translate(0,102vh) scale(0.5);opacity:0;} 10%{opacity:.5;} 90%{opacity:.5;} 100%{transform:translate(40px,-8vh) scale(1.2);opacity:0;} }

    /* ===================== CARD ÚNICO ===================== */
    .card {
      width: 92%; max-width: 720px;
      background: var(--vidro-forte);
      border: 1.5px solid var(--vidro-borda-hi); border-radius: 26px;
      box-shadow: var(--glow-ouro-forte), var(--sombra-forte);
      padding: clamp(18px, 2.6vw, 30px);
      display: flex; flex-direction: column; gap: clamp(14px, 2vw, 20px);
    }
    .card-step { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 5px; padding-bottom: clamp(10px, 1.4vw, 16px); border-bottom: 1px solid var(--vidro-borda); }
    .card-step-label { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; color: var(--ouro-fundo); font-size: clamp(10px, 1vw, 12px); display: inline-flex; align-items: center; gap: 7px; }
    .card-step-label .pip { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, var(--ouro-fundo), var(--ouro-claro)); color: #fff; font-size: 11px; }
    .card-step-label i { font-style: normal; opacity: 0.55; }
    .card-step-nome { font-family: var(--font-display); font-weight: 700; color: var(--texto); font-size: clamp(18px, 2.3vw, 27px); line-height: 1.1; letter-spacing: 0.005em; }
    .card-corpo { display: grid; grid-template-columns: 0.82fr 1.1fr; align-items: center; gap: clamp(16px, 3vw, 40px); }
    .card-capa { width: 100%; max-width: 230px; aspect-ratio: 1/1; justify-self: center; border-radius: 16px; overflow: hidden; box-shadow: var(--sombra-forte); border: 2px solid var(--vidro-borda-hi); }
    .card-capa img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-texto { display: flex; flex-direction: column; gap: 12px; }
    .card-fala { font-family: var(--font-body); font-style: italic; color: var(--texto); font-size: clamp(18px, 2.4vw, 29px); line-height: 1.22; }
    .card-nome { font-family: var(--font-display); font-weight: 600; color: var(--ouro-fundo); font-size: clamp(13px, 1.4vw, 17px); line-height: 1.3; letter-spacing: 0.01em; }
    .card-cta { align-self: flex-start; margin-top: 4px; display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; background: linear-gradient(135deg, var(--ouro-fundo), var(--ouro)); color: #fff; border: none; border-radius: 999px; font-family: var(--font-display); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; box-shadow: var(--sombra-media); transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card-cta:hover { transform: translateY(-2px); box-shadow: var(--glow-ouro), var(--sombra-forte); }
    .card-cta:active { transform: translateY(0); }
    .card-cta svg { width: 14px; height: 14px; }

    /* ===== COMPRADO (desbloqueado) — contorno verde + brilho ===== */
    .card { position: relative; }
    .card.comprado { border-color: var(--verde); box-shadow: var(--glow-verde), var(--sombra-forte); }
    .bolha.comprado, .bolinha-final.comprado { border-color: var(--verde); box-shadow: var(--glow-verde), var(--sombra-media); }
    .chip-desbloqueado {
      position: absolute; top: 14px; right: 14px; z-index: 2;
      display: inline-flex; align-items: center; gap: 5px;
      font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
      color: #fff; padding: 5px 11px 5px 8px; border-radius: 999px;
      background: linear-gradient(135deg, var(--verde), var(--verde-fundo));
      box-shadow: 0 2px 10px rgba(47,168,79,0.4);
    }
    .chip-desbloqueado svg { width: 13px; height: 13px; }

    /* ===================== PALCO (animação) ===================== */
    .palco { position: fixed; inset: 0; z-index: 50; pointer-events: none; transition: opacity 0.5s ease; }
    .palco.oculto { opacity: 0; }

    .titulo-topo { position: absolute; left: 50%; top: 9%; transform: translateX(-50%); text-align: center; width: 92%; max-width: 900px; opacity: 0; will-change: opacity, transform; z-index: 9; }
    .titulo-eyebrow { font-family: var(--font-body); font-style: italic; color: var(--texto-suave); letter-spacing: 0.04em; font-size: clamp(13px,1.6vw,19px); margin-bottom: 8px; }
    .titulo-nome { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.005em; line-height: 1.05; font-size: clamp(30px,5.2vw,60px); background: linear-gradient(135deg,var(--ouro-fundo) 0%,var(--ouro-brilho) 50%,var(--ouro-fundo) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 16px rgba(200,146,42,0.3)); }
    .titulo-sublinha { font-family: var(--font-body); font-style: italic; color: var(--texto-suave); font-size: clamp(13px,1.4vw,17px); margin-top: 10px; opacity: 0.85; }

    .circulo { position: absolute; left: 50%; top: var(--palco-y); transform: translate(-50%,-50%); width: 100%; max-width: 520px; aspect-ratio: 1/1; z-index: 3; }
    .bolha { position: absolute; left: 50%; top: 50%; width: var(--size,120px); height: var(--size,120px); margin-left: calc(var(--size,120px)/-2); margin-top: calc(var(--size,120px)/-2); border-radius: 50%; overflow: hidden; border: 2px solid var(--vidro-borda-hi); box-shadow: var(--glow-ouro), var(--sombra-media); background: var(--vidro-forte); opacity: 0; will-change: transform, opacity, filter; }
    .bolha img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .torre { position: absolute; inset: 0; z-index: 6; visibility: hidden; }
    .torre .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: 0; will-change: transform, opacity, filter; }

    /* ===================== PÁGINA REAL ===================== */
    .pagina { position: relative; z-index: 10; opacity: 0; transition: opacity 0.6s ease; padding-bottom: clamp(80px, 10vw, 140px); }
    .pagina.visivel { opacity: 1; }

    /* TOPO: textos + círculos lado a lado, no topo da tela */
    .topo-jornada {
      text-align: center;
      padding: clamp(42px, 7vh, 84px) 24px clamp(6px, 1.4vh, 16px);
      display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 1.8vh, 18px);
    }
    .tj-eyebrow { font-family: var(--font-body); font-style: italic; color: var(--texto-suave); font-size: clamp(13px,1.5vw,18px); letter-spacing: 0.04em; }
    .tj-titulo { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px,5vw,58px); line-height: 1.04; background: linear-gradient(135deg,var(--ouro-fundo),var(--ouro-brilho) 50%,var(--ouro-fundo)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px rgba(200,146,42,0.25)); }
    .tj-sub { font-family: var(--font-body); color: var(--texto-suave); font-size: clamp(14px,1.6vw,19px); max-width: 600px; }
    .row-bolinhas { display: flex; gap: clamp(10px,1.6vw,20px); flex-wrap: wrap; justify-content: center; align-items: center; margin-top: 4px; max-width: 92vw; }
    .bolinha-final { position: relative; width: clamp(66px,9vw,104px); height: clamp(66px,9vw,104px); border-radius: 50%; overflow: hidden; border: 2px solid var(--vidro-borda-hi); box-shadow: var(--glow-ouro), var(--sombra-media); background: var(--vidro-forte); cursor: pointer; transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), box-shadow 0.25s ease; opacity: 0; transform: scale(0.6) translateY(16px); will-change: transform, opacity; padding: 0; flex: 0 0 auto; }
    .bolinha-final img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .bolinha-final:hover { transform: scale(1.08); box-shadow: var(--glow-ouro-forte), var(--sombra-forte); }
    .bolinha-final:active { transform: scale(0.96); }

    /* barra de progresso da jornada (Lottie) abaixo das bolinhas */
    .progresso-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: clamp(8px,1.6vh,18px); opacity: 0; }
    .progresso-bar { width: min(360px, 80vw); height: 78px; overflow: hidden; position: relative; }
    .progresso-bar > div { position: absolute; left: 0; top: 50%; width: 100%; aspect-ratio: 1/1; transform: translateY(-50%); }
    .progresso-label { font-family: var(--font-display); font-weight: 600; font-size: clamp(12px,1.3vw,14px); letter-spacing: 0.02em; color: var(--ouro-fundo); }
    .progresso-label b { color: var(--verde-fundo); }

    /* respiro mínimo + lista de materiais logo abaixo */
    .lista-materiais { max-width: 720px; margin: clamp(18px, 3vh, 34px) auto 0; padding: 0 24px; display: flex; flex-direction: column; align-items: center; gap: clamp(22px, 3.5vw, 40px); }
    .lista-item { scroll-margin-top: 18px; transition: box-shadow 0.3s ease, transform 0.3s ease; }
    .lista-item.destacado { box-shadow: var(--glow-ouro-forte), var(--sombra-forte); transform: translateY(-2px); }

    /* botão rever (teste) */
    .btn-rever { position: fixed; top: 14px; right: 14px; background: var(--vidro-forte); border: 1px solid var(--vidro-borda-hi); color: var(--texto); padding: 8px 14px 8px 11px; border-radius: 999px; font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.03em; cursor: pointer; opacity: 0; transition: opacity 0.5s ease, transform 0.18s ease; z-index: 99; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: inline-flex; align-items: center; gap: 6px; }
    .btn-rever.visivel { opacity: 0.7; } .btn-rever:hover { opacity: 1; transform: scale(1.04); } .btn-rever:active { transform: scale(0.96); }
    .btn-rever svg { width: 13px; height: 13px; }

    /* ===================== Mobile ===================== */
    @media (max-aspect-ratio: 1/1), (max-width: 720px) {
      :root { --palco-y: 50%; }
      .titulo-topo { top: 7%; } .titulo-nome { font-size: clamp(28px,8vw,44px); }
      .circulo { max-width: 86vw; }
      .card { max-width: 92vw; }
      .card-corpo { grid-template-columns: 1fr; text-align: center; gap: 14px; }
      .card-capa { max-width: 168px; }
      .card-cta { align-self: center; }
      .tj-titulo { font-size: clamp(28px,8vw,44px); }
    }
    @media (prefers-reduced-motion: reduce) { .particula { animation: none; opacity: 0.3; } }
  </style>
</head>

<body>
  <!-- FUNDO fixo -->
  <div class="fundo" aria-hidden="true"><div class="particulas" id="particulas"></div></div>

  <!-- PALCO da animação (some no fim) -->
  <div class="palco" id="palco" aria-hidden="true">
    <div class="titulo-topo" id="titulo-topo">
      <p class="titulo-eyebrow" id="titulo-eyebrow">A sua jornada começa</p>
      <h1 class="titulo-nome" id="titulo-nome">Vida Mágica</h1>
      <p class="titulo-sublinha" id="titulo-sublinha">Estes são os materiais do seu caminho</p>
    </div>
    <div class="circulo" id="circulo"></div>
    <div class="torre" id="torre"></div>
  </div>

  <!-- PÁGINA REAL -->
  <main class="pagina" id="pagina">
    <header class="topo-jornada" id="topo-jornada">
      <p class="tj-eyebrow">Essa é a sua jornada</p>
      <h1 class="tj-titulo" id="tj-titulo">Vida Mágica</h1>
      <p class="tj-sub">Toque em qualquer material pra conhecer melhor</p>
      <div class="row-bolinhas" id="row-bolinhas"></div>
      <div class="progresso-wrap" id="progresso-wrap">
        <div class="progresso-bar" id="progresso-bar"></div>
        <div class="progresso-label" id="progresso-label"></div>
      </div>
    </header>
    <div class="lista-materiais" id="materiais-lista"></div>
  </main>

  <button class="btn-rever" id="btn-rever" type="button" aria-label="Atualizar jornada">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><polyline points="3 4 3 10 9 10"></polyline></svg> Atualizar jornada
  </button>

  <script>
    'use strict';

    // ============================================================
    // DADOS — material = unidade. fala = linha curta CONECTADA.
    // (Textos = placeholders; Renato revisa.) Depois vem de /api/app/contexto.
    // ============================================================
    const JORNADAS = {
      conhecer_e_despertar: {
        nome: 'Conhecer e Despertar', eyebrow: 'A sua jornada começa', sublinha: 'Estes são os materiais do seu caminho',
        materiais: [
          { slug:'teste_subconsciente', passo:1, passoTag:'Conhecer',      comprado:true, nome:'Teste do Subconsciente',            fala:'Tudo começa quando você se enxerga por inteiro.', descricao:'O retrato fiel do que hoje funciona dentro de você — e do que precisa despertar.', imagem:'/assets/products/teste-subconsciente.webp', cta:'Refazer o teste' },
          { slug:'vencendo_medo',       passo:2, passoTag:'Despertar',     nome:'Vencendo o Medo',                   fala:'Aí a gente acende a luz no que mais trava você.', descricao:'O livro da Série Conhecer e Despertar que trabalha a energia do medo.', imagem:'/assets/products/ebook-vencendoomedo.webp', cta:'Conhecer o livro' },
          { slug:'vencendo_desordem',   passo:2, passoTag:'Despertar',     nome:'Vencendo a Desordem',               fala:'E organiza por dentro pra fluir por fora.', descricao:'O livro que trabalha a energia da desordem — pra dentro e pra fora.', imagem:'/assets/products/ebook-vencendoadesordem.webp', cta:'Conhecer o livro' },
          { slug:'ouro_reprogramacao',  passo:3, passoTag:'Reprogramação', nome:'Curso Ouro da Reprogramação Mental', fala:'Até a reprogramação virar o seu novo normal.', descricao:'O passo que fecha a primeira jornada e prepara a próxima.', imagem:'/assets/products/ouro-reprogramacao.webp', cta:'Conhecer o curso' },
        ],
      },
      vida_magica: {
        nome: 'Vida Mágica', eyebrow: 'A sua jornada começa', sublinha: 'Estes são os materiais do seu caminho',
        materiais: [
          { slug:'lda_biblica',        passo:1, passoTag:'Reprogramação',  comprado:true,  nome:'Curso Lei da Atração Bíblica',          fala:'Tudo começa aqui — reprogramando como você atrai.', descricao:'O curso que reescreve os padrões que você nem sabia que tinha. É a base de tudo.', imagem:'/assets/products/lda-biblica.webp', cta:'Conhecer o curso' },
          { slug:'guia_pratico',       passo:2, passoTag:'Prática diária', comprado:true,  nome:'Guia Prático para Reprogramar a Mente', fala:'Depois, isso entra no seu dia e vira hábito.', descricao:'Práticas curtas e diárias pra manter a reprogramação viva.', imagem:'/assets/products/guia-pratico.webp', cta:'Ver o guia' },
          { slug:'magica_fluir',       passo:2, passoTag:'Prática diária', comprado:false, nome:'Guia de Bolso Mágica do Fluir',         fala:'E o fluir passa a caber no seu bolso.', descricao:'Um guia de bolso pra destravar o fluxo em qualquer momento.', imagem:'/assets/products/magica-fluir.webp', cta:'Ver o guia de bolso' },
          { slug:'atal_maneira_livro', passo:3, passoTag:'Aprofundamento', comprado:false, nome:'Livro Digital A Tal Maneira',           fala:'Até abrir a porta do seu próximo nível.', descricao:'O livro que é a ponte pra Multiplicando a Vida Mágica.', imagem:'/assets/products/atal-maneira-livro.webp', cta:'Conhecer o livro' },
        ],
      },
      multiplicando_vida_magica: {
        nome: 'Multiplicando a Vida Mágica', eyebrow: 'Você chegou na última jornada', sublinha: 'Um material. Tudo o que falta pra multiplicar.',
        materiais: [
          { slug:'atal_maneira_curso', passo:1, passoTag:'Multiplicar', nome:'Curso A Tal Maneira', fala:'Um passo só: multiplicar tudo o que você já é.', descricao:'O curso que finaliza sua jornada — e abre a porta da multiplicação.', imagem:'/assets/products/atal-maneira-curso.webp', cta:'Conhecer o curso' },
        ],
      },
    };

    const params = new URLSearchParams(location.search);
    const jornadaSlug = params.get('j') || 'vida_magica';
    const JORNADA = JORNADAS[jornadaSlug] || JORNADAS.vida_magica;
    const MATERIAIS = JORNADA.materiais;
    const N = MATERIAIS.length;
    const TOTAL_PASSOS = Math.max(...MATERIAIS.map(m => m.passo));

    // ============================================================
    // MARKUP COMPARTILHADO DO CARD (torre = lista)
    // ============================================================
    function cardInner(mat, comCta) {
      const cta = comCta ? `<a class="card-cta" href="#">${mat.cta} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></a>` : '';
      const chip = mat.comprado ? `<span class="chip-desbloqueado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Desbloqueado</span>` : '';
      return `
        ${chip}
        <div class="card-step">
          <span class="card-step-label"><span class="pip">${mat.passo}</span> Passo ${mat.passo} <i>de</i> ${TOTAL_PASSOS}</span>
          <span class="card-step-nome">${mat.passoTag}</span>
        </div>
        <div class="card-corpo">
          <div class="card-capa"><img src="${mat.imagem}" alt="${mat.nome}"></div>
          <div class="card-texto">
            <div class="card-fala">${mat.fala}</div>
            <div class="card-nome">${mat.nome}</div>
            ${cta}
          </div>
        </div>`;
    }

    // ============================================================
    // SETUP
    // ============================================================
    function preencherTextoFixo() {
      document.getElementById('titulo-eyebrow').textContent = JORNADA.eyebrow;
      document.getElementById('titulo-nome').textContent = JORNADA.nome;
      document.getElementById('titulo-sublinha').textContent = JORNADA.sublinha;
      document.getElementById('tj-titulo').textContent = JORNADA.nome;
    }

    function criarParticulas() {
      const c = document.getElementById('particulas'); c.innerHTML = '';
      for (let i = 0; i < 26; i++) {
        const p = document.createElement('div'); p.className = 'particula';
        p.style.left = `${Math.random()*100}%`;
        const dur = 12 + Math.random()*14;
        p.style.animationDuration = `${dur}s`; p.style.animationDelay = `-${Math.random()*dur}s`;
        p.style.transform = `scale(${0.5+Math.random()*1.3})`;
        c.appendChild(p);
      }
    }

    function criarCirculo() {
      const cont = document.getElementById('circulo'); cont.innerHTML = '';
      const lado = Math.min(cont.clientWidth, cont.clientHeight) || Math.min(innerWidth, innerHeight);
      const fator = N <= 2 ? 0.30 : N <= 4 ? 0.26 : 0.22;
      const bolhaSz = Math.min(140, lado * fator);
      const raio = N === 1 ? 0 : lado * (N <= 4 ? 0.33 : 0.36);
      const bolhas = [];
      for (let i = 0; i < N; i++) {
        const ang = (i/N)*2*Math.PI - Math.PI/2;
        const x = N===1?0:Math.cos(ang)*raio, y = N===1?0:Math.sin(ang)*raio;
        const b = document.createElement('div'); b.className = 'bolha' + (MATERIAIS[i].comprado ? ' comprado' : '');
        b.style.setProperty('--size', `${bolhaSz}px`); b.dataset.x = x.toFixed(1); b.dataset.y = y.toFixed(1);
        const img = document.createElement('img'); img.src = MATERIAIS[i].imagem; img.alt = MATERIAIS[i].nome;
        b.appendChild(img); cont.appendChild(b); bolhas.push(b);
      }
      return bolhas;
    }

    function criarTorre() {
      const cont = document.getElementById('torre'); cont.innerHTML = '';
      MATERIAIS.forEach((mat, idx) => {
        const card = document.createElement('div'); card.className = 'card' + (mat.comprado ? ' comprado' : ''); card.dataset.idx = idx;
        card.innerHTML = cardInner(mat, false);
        cont.appendChild(card);
      });
    }

    function criarRowBolinhas() {
      const row = document.getElementById('row-bolinhas'); row.innerHTML = '';
      MATERIAIS.forEach(mat => {
        const b = document.createElement('button'); b.className = 'bolinha-final' + (mat.comprado ? ' comprado' : '');
        b.title = mat.nome; b.setAttribute('aria-label', mat.nome);
        const img = document.createElement('img'); img.src = mat.imagem; img.alt = mat.nome; b.appendChild(img);
        b.addEventListener('click', () => irPara(mat.slug));
        row.appendChild(b);
      });
    }

    function criarLista() {
      const cont = document.getElementById('materiais-lista'); cont.innerHTML = '';
      MATERIAIS.forEach(mat => {
        const art = document.createElement('article'); art.className = 'card lista-item' + (mat.comprado ? ' comprado' : ''); art.setAttribute('data-mat-slug', mat.slug);
        art.innerHTML = cardInner(mat, true);
        cont.appendChild(art);
      });
    }

    function irPara(slug) {
      const alvo = document.querySelector(`.lista-item[data-mat-slug="${slug}"]`);
      if (alvo) { alvo.scrollIntoView({ behavior:'smooth', block:'center' }); alvo.classList.add('destacado'); setTimeout(()=>alvo.classList.remove('destacado'), 2200); }
    }

    // ===== Barra de progresso da jornada (Lottie) =====
    const COMPRADOS = MATERIAIS.filter(m => m.comprado).length;
    let animProgresso = null, progLoaded = false;
    function criarProgresso() {
      const cont = document.getElementById('progresso-bar'); cont.innerHTML = '';
      progLoaded = false;
      animProgresso = lottie.loadAnimation({ container: cont, renderer:'svg', loop:false, autoplay:false, path:'/assets/jornada-progresso.json' });
      animProgresso.addEventListener('DOMLoaded', ()=>{ progLoaded = true; animProgresso.goToAndStop(0, true); });
      const label = document.getElementById('progresso-label');
      label.innerHTML = `<b>${COMPRADOS}</b> de ${N} ${N===1?'material desbloqueado':'materiais desbloqueados'}`;
    }
    function tocarProgresso() {
      const frac = N>0 ? COMPRADOS/N : 0;
      const go = ()=>{ const tf = animProgresso.totalFrames || 60; const target = frac<=0 ? 0 : Math.max(1, Math.round(frac*tf)); animProgresso.playSegments([0, target], true); };
      if (progLoaded) go(); else animProgresso.addEventListener('DOMLoaded', go);
    }

    // ============================================================
    // TIMING
    // ============================================================
    const T = { tituloIn:{start:300,dur:800}, circuloIn:{start:1100,dur:900,stagger:110}, circuloHold:{dur:650}, torreIntro:480, torreHold:820, torreTravel:480, torreOutro:420 };

    let waapi = [], towerRAF = null;
    const track = a => { waapi.push(a); return a; };
    function cancelarTudo() { waapi.forEach(a=>{try{a.cancel();}catch(_){}}); waapi=[]; if(towerRAF){cancelAnimationFrame(towerRAF);towerRAF=null;} }

    const easeIO = p => p<0.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;

    function rodarTorre(onFim) {
      const torre = document.getElementById('torre'); torre.style.visibility='visible';
      const cards = Array.from(torre.querySelectorAll('.card'));
      const heroH = window.innerHeight;
      const cardH = cards[0] ? cards[0].offsetHeight : heroH*0.4;
      const spacing = Math.max(heroH*0.5, cardH*1.18);

      const kf = [{t:0,y:-0.5}]; let acc = T.torreIntro; kf.push({t:acc,y:0});
      for (let i=0;i<N;i++){ acc+=T.torreHold; kf.push({t:acc,y:i}); if(i<N-1){acc+=T.torreTravel; kf.push({t:acc,y:i+1});} }
      acc+=T.torreOutro; kf.push({t:acc,y:(N-1)+0.5}); const dur=acc;
      function camYAt(t){ if(t<=kf[0].t)return kf[0].y; for(let i=1;i<kf.length;i++){ if(t<=kf[i].t){ const a=kf[i-1],b=kf[i],span=b.t-a.t; let p=span>0?(t-a.t)/span:1; if(b.y!==a.y)p=easeIO(p); return a.y+(b.y-a.y)*p; } } return kf[kf.length-1].y; }

      const start = performance.now();
      function frame(now){
        const t = now-start, camY = camYAt(t);
        cards.forEach((card,idx)=>{
          const offset=(idx-camY)*spacing, an=Math.abs(offset/spacing);
          const blur=Math.min(12,an*8), scale=Math.max(0.62,1-an*0.18), opacity=Math.max(0.18,1-an*0.5);
          card.style.transform=`translate(-50%, calc(-50% + ${offset}px)) scale(${scale})`;
          card.style.filter=`blur(${blur}px)`; card.style.opacity=opacity.toFixed(3); card.style.zIndex=String(Math.round(100-an*10));
        });
        if(t<dur) towerRAF=requestAnimationFrame(frame);
        else { towerRAF=null; if(onFim)onFim(); }
      }
      towerRAF=requestAnimationFrame(frame);
    }

    // ============================================================
    // REVELAR A PÁGINA (fim da animação)
    // ============================================================
    function revelarPagina() {
      const palco = document.getElementById('palco');
      const pagina = document.getElementById('pagina');
      // sobe pro topo antes de revelar (bloco fica no topo)
      window.scrollTo({ top: 0, behavior: 'instant' });
      palco.classList.add('oculto');
      pagina.classList.add('visivel');
      document.body.classList.remove('travado');

      // topo entra (settle) + bolinhas em stagger
      const topo = document.getElementById('topo-jornada');
      track(topo.animate([{opacity:0,transform:'translateY(-14px)'},{opacity:1,transform:'translateY(0)'}],{duration:650,easing:'cubic-bezier(0.16,1,0.3,1)',fill:'forwards'}));
      const bolinhas = Array.from(document.querySelectorAll('.bolinha-final'));
      bolinhas.forEach((b,i)=>{ setTimeout(()=>{ track(b.animate([{opacity:0,transform:'scale(0.6) translateY(16px)'},{opacity:1,transform:'scale(1.1) translateY(-3px)',offset:0.7},{opacity:1,transform:'scale(1) translateY(0)'}],{duration:600,easing:'cubic-bezier(0.22,1.2,0.36,1)',fill:'forwards'})); }, 250 + i*90); });
      // barra de progresso entra e preenche
      const progWrap = document.getElementById('progresso-wrap');
      setTimeout(()=>{ track(progWrap.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:600,easing:'cubic-bezier(0.16,1,0.3,1)',fill:'forwards'})); tocarProgresso(); }, 250 + N*90 + 200);
      // etapa 1 (e demais) sobem suave
      const itens = Array.from(document.querySelectorAll('.lista-item'));
      itens.forEach((it,i)=>{ setTimeout(()=>{ track(it.animate([{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'translateY(0)'}],{duration:600,easing:'cubic-bezier(0.16,1,0.3,1)',fill:'forwards'})); }, 350 + i*100); });

      setTimeout(()=>{ document.getElementById('palco').style.display='none'; }, 600);
      setTimeout(()=>{ document.getElementById('btn-rever').classList.add('visivel'); }, 900);
    }

    // ============================================================
    // ORQUESTRADOR (toca UMA VEZ)
    // ============================================================
    function resetParaTocar() {
      cancelarTudo();
      const palco = document.getElementById('palco'); palco.style.display=''; palco.classList.remove('oculto');
      document.getElementById('pagina').classList.remove('visivel');
      document.getElementById('btn-rever').classList.remove('visivel');
      document.body.classList.add('travado');
      const t = document.getElementById('titulo-topo'); t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(-10px)';
      document.querySelectorAll('.bolha').forEach(b=>{b.style.transform='translate(0,0) scale(0)';b.style.opacity='0';b.style.filter='blur(0)';});
      const torre=document.getElementById('torre'); torre.style.visibility='hidden';
      document.querySelectorAll('.torre .card').forEach(c=>{c.style.opacity='0';});
      document.querySelectorAll('.bolinha-final').forEach(b=>{b.style.opacity='0';b.style.transform='scale(0.6) translateY(16px)';});
      document.querySelectorAll('.lista-item').forEach(it=>{it.style.opacity='0';});
      const pw = document.getElementById('progresso-wrap'); pw.style.opacity='0';
      if (animProgresso && progLoaded) animProgresso.goToAndStop(0, true);
    }

    async function tocarAnimacao() {
      resetParaTocar();
      await new Promise(r=>requestAnimationFrame(r));

      const titulo = document.getElementById('titulo-topo');
      const bolhas = Array.from(document.querySelectorAll('.bolha'));

      track(titulo.animate([{opacity:0,transform:'translateX(-50%) translateY(-10px)'},{opacity:1,transform:'translateX(-50%) translateY(0)'}],{duration:T.tituloIn.dur,delay:T.tituloIn.start,easing:'cubic-bezier(0.16,1,0.3,1)',fill:'forwards'}));

      bolhas.forEach((b,i)=>{ const x=parseFloat(b.dataset.x),y=parseFloat(b.dataset.y);
        track(b.animate([{transform:'translate(0,0) scale(0)',opacity:0},{transform:`translate(${x}px,${y}px) scale(1.1)`,opacity:1,offset:0.7},{transform:`translate(${x}px,${y}px) scale(1)`,opacity:1}],{duration:T.circuloIn.dur,delay:T.circuloIn.start+i*T.circuloIn.stagger,easing:'cubic-bezier(0.22,1.2,0.36,1)',fill:'forwards'})); });

      const fimCirculoIn = T.circuloIn.start + (N-1)*T.circuloIn.stagger + T.circuloIn.dur;
      const inicioTorre = fimCirculoIn + T.circuloHold.dur;

      track(titulo.animate([{opacity:1,transform:'translateX(-50%) translateY(0)'},{opacity:0,transform:'translateX(-50%) translateY(-12px)'}],{duration:450,delay:inicioTorre-450,easing:'cubic-bezier(0.7,0,0.84,0)',fill:'forwards'}));
      bolhas.forEach((b,i)=>{ const x=parseFloat(b.dataset.x),y=parseFloat(b.dataset.y);
        track(b.animate([{transform:`translate(${x}px,${y}px) scale(1)`,opacity:1,filter:'blur(0)'},{transform:`translate(${x*1.9}px,${y*1.9}px) scale(1.8)`,opacity:0,filter:'blur(12px)'}],{duration:600,delay:inicioTorre-450+i*55,easing:'cubic-bezier(0.7,0,0.84,0)',fill:'forwards'})); });

      setTimeout(()=>{ rodarTorre(revelarPagina); }, inicioTorre);
    }

    // ============================================================
    // BOOT (toca 1x)
    // ============================================================
    preencherTextoFixo(); criarParticulas(); criarCirculo(); criarTorre(); criarRowBolinhas(); criarLista(); criarProgresso();

    let imgsCarregadas=0; const todasImgs=document.querySelectorAll('.palco img, .row-bolinhas img');
    function tentarTocar(){ imgsCarregadas++; if(imgsCarregadas>=todasImgs.length) setTimeout(tocarAnimacao,200); }
    if(todasImgs.length===0) setTimeout(tocarAnimacao,200);
    else todasImgs.forEach(img=>{ if(img.complete)tentarTocar(); else { img.addEventListener('load',tentarTocar,{once:true}); img.addEventListener('error',tentarTocar,{once:true}); } });
    setTimeout(()=>{ if(imgsCarregadas<todasImgs.length) tocarAnimacao(); }, 2500);

    // Rever = só pra teste (não há loop automático)
    document.getElementById('btn-rever').addEventListener('click', ()=>{ criarCirculo(); setTimeout(tocarAnimacao,100); });
  </script>
</body>
</html>
