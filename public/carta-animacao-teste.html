<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carta — animação (teste)</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #111; color: #eee; }
    header { padding: 18px 16px 6px; }
    header h1 { font-size: 17px; margin: 0 0 4px; font-weight: 700; }
    header p { font-size: 12.5px; margin: 0; color: #aaa; line-height: 1.5; }

    .row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,.06); }
    .lbl { width: 92px; font-size: 12px; color: rgba(255,255,255,.55); flex-shrink: 0; }
    .cena { flex: 1; height: 158px; border-radius: 14px; overflow: hidden; }

    /* paletas dos temas (acento principal + claro) */
    .t-vm { background: radial-gradient(circle at 50% -10%, #FBF6EA, #E8DCC0); --ac:#C8922A; --ac2:#E8C97A; }
    .t-md { background: #1d2a1f; --ac:#e0c878; --ac2:#f0e0a8; }
    .t-un { background: #0a0e26; --ac:#8fb8ff; --ac2:#cfe0ff; }
    .t-mg { background: #cdd0ee; --ac:#8a6fd6; --ac2:#c4b6f2; }

    svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .arco  { fill: none; stroke: var(--ac); stroke-width: 1.4; stroke-dasharray: 2 6; stroke-linecap: round; opacity: .5; }
    .nuvem { fill: #fff; }
    .nuvem-sb { fill: var(--ac); opacity: .18; }
    .spark { fill: var(--ac); }
  </style>
</head>
<body>
  <header>
    <h1>Carta do Tempo — voo (momento 2: trancada/viajando)</h1>
    <p>SVG + CSS, transparente, recolore por tema sozinho. Veja o movimento nos 4 mundos.<br>Me diga o que ajustar: nuvens, envelope, arco, ritmo, sparkles.</p>
  </header>
  <div id="rows"></div>

  <script>
    var SVG = '\
    <svg viewBox="0 0 320 150" preserveAspectRatio="xMidYMid meet">\
      <path class="arco" d="M58,104 Q160,40 262,104"/>\
      <g transform="translate(58,104)">\
        <g class="nuvem-sb" transform="translate(2,4)"><circle cx="-12" cy="4" r="11"/><circle cx="2" cy="-2" r="14"/><circle cx="16" cy="4" r="11"/><rect x="-14" y="2" width="32" height="12" rx="6"/></g>\
        <g class="nuvem"><circle cx="-12" cy="4" r="11"/><circle cx="2" cy="-2" r="14"/><circle cx="16" cy="4" r="11"/><rect x="-14" y="2" width="32" height="12" rx="6"/></g>\
      </g>\
      <g transform="translate(262,104)">\
        <g class="nuvem-sb" transform="translate(2,4)"><circle cx="-12" cy="4" r="11"/><circle cx="2" cy="-2" r="14"/><circle cx="16" cy="4" r="11"/><rect x="-14" y="2" width="32" height="12" rx="6"/></g>\
        <g class="nuvem"><circle cx="-12" cy="4" r="11"/><circle cx="2" cy="-2" r="14"/><circle cx="16" cy="4" r="11"/><rect x="-14" y="2" width="32" height="12" rx="6"/></g>\
      </g>\
      <g class="spark" opacity=".7"><path d="M120,44 l1.6,3.4 3.4,1.6 -3.4,1.6 -1.6,3.4 -1.6,-3.4 -3.4,-1.6 3.4,-1.6z"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2s" repeatCount="indefinite"/></path></g>\
      <g class="spark" opacity=".7"><path d="M200,52 l1.3,2.7 2.7,1.3 -2.7,1.3 -1.3,2.7 -1.3,-2.7 -2.7,-1.3 2.7,-1.3z"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.4s" repeatCount="indefinite"/></path></g>\
      <circle class="spark" cx="160" cy="38" r="2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.8s" repeatCount="indefinite"/></circle>\
      <g>\
        <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.45 0 0.55 1" path="M58,100 Q160,36 262,100"/>\
        <rect x="-15" y="-10" width="30" height="20" rx="2.5" fill="var(--ac)"/>\
        <path d="M-15,-10 L0,2 L15,-10 Z" fill="var(--ac2)"/>\
        <path d="M-15,-9 L0,3 L15,-9" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.6" stroke-linejoin="round"/>\
      </g>\
    </svg>';

    var temas = [["Vida Mágica","t-vm"],["Medieval","t-md"],["Universo","t-un"],["Mágico","t-mg"]];
    var html = "";
    temas.forEach(function (t) {
      html += '<div class="row"><div class="lbl">' + t[0] + '</div><div class="cena ' + t[1] + '">' + SVG + '</div></div>';
    });
    document.getElementById("rows").innerHTML = html;
  </script>
</body>
</html>
